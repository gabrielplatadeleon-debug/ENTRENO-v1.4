      const [syncStatus, setSyncStatus] = React.useState("Desconectado de Drive");
      const [accessToken, setAccessToken] = React.useState(null);
      const [folderId, setFolderId] = React.useState(null);
      const [flashExId, setFlashExId] = React.useState(null);
      const [lastPrMessage, setLastPrMessage] = React.useState(null);
      
      const [timer, setTimer] = React.useState({ active: false, targetTimestamp: 0, secondsLeft: 0, exName: "" });
      const wakeLockRef = React.useRef(null);

      const currentMode = MODE_CONFIGS[trainingMode];
      const defaultInput = (id) => {
        const ex = Object.values(ROUTINE_VARIANTS).flatMap(d => d.semanaA).find(e => e.id === id);
        return { peso: logs[id]?.[0]?.peso ?? 0, reps: Number(ex?.reps.split('-')[0]) || currentMode.repsDefault, rir: Number(ex?.rir.split('-')[0]) ?? currentMode.rirDefault };
      };

      React.useEffect(() => {
        loadFailed.current = false;
        let saved;
        try { saved = localStorage.getItem(`entreno_logs_${currentProfile}`); } catch { loadFailed.current = true; setSaveStatus("Almacenamiento no disponible. No se guardarán series."); setLogs({}); return; }
        if (saved) {
          try { setLogs(JSON.parse(saved)); setInputs({}); } catch(e){ loadFailed.current = true; setLogs({}); setSaveStatus("Historial ilegible. No registres series hasta recuperar tu copia."); }
        } else {
          setLogs({});
        }
        setInputs({});
      }, [currentProfile]);

      React.useEffect(() => {
        let interval = null;
        if (timer.active) {
          if ('wakeLock' in navigator && !wakeLockRef.current) {
            navigator.wakeLock.request('screen').then(lock => {
              wakeLockRef.current = lock;
            }).catch(err => {});
          }

          interval = setInterval(() => {
            const now = Date.now();
            const left = Math.max(0, Math.ceil((timer.targetTimestamp - now) / 1000));
            if (left > 0) {
              setTimer(prev => ({ ...prev, secondsLeft: left }));
            } else {
              setTimer(prev => ({ ...prev, active: false, secondsLeft: 0 }));
              if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
              releaseWakeLock();
            }
          }, 500);
        } else {
          releaseWakeLock();
        }
        return () => clearInterval(interval);
      }, [timer.active, timer.targetTimestamp]);

      const releaseWakeLock = () => {
        if (wakeLockRef.current) {
          wakeLockRef.current.release().then(() => {
            wakeLockRef.current = null;
          }).catch(err => {});
        }
      };

      const startTimerWithSeconds = (secs, exName) => {
        const target = Date.now() + (secs * 1000);
        setTimer({ active: true, targetTimestamp: target, secondsLeft: secs, exName });
      };

      const adjustTimerTime = (deltaSecs) => {
        setTimer(prev => {
          const newTarget = prev.targetTimestamp + (deltaSecs * 1000);
          const left = Math.max(0, Math.ceil((newTarget - Date.now()) / 1000));
          return { ...prev, targetTimestamp: newTarget, secondsLeft: left };
        });
      };

      const getOrCreateAppFolder = async (token) => {
        try {
          const searchFolder = await checkedFetch(
            `https://www.googleapis.com/drive/v3/files?q=name='ENTRENO_PRO_DATA' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const data = await searchFolder.json();
          if (data.files && data.files.length > 0) return data.files[0].id;
          const meta = { name: 'ENTRENO_PRO_DATA', mimeType: 'application/vnd.google-apps.folder' };
          const createRes = await checkedFetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(meta)
          });
          const created = await createRes.json();
          return created.id;
        } catch (err) { return null; }
      };

      const handleGoogleLogin = () => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: async (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              setSyncStatus("Conectando con Drive...");
              const fId = await getOrCreateAppFolder(response.access_token);
              setFolderId(fId);
              setSyncStatus(fId ? "Conectado a /ENTRENO_PRO_DATA/ ☁️" : "Conectado (Raíz)");
              alert("¡Conectado exitosamente con Google Drive!");
            }
          },
        });
        client.requestAccessToken();
      };

      const syncToDriveCloud = async (updatedLogs) => {
        if (!accessToken) { setSyncStatus("Guardado en móvil · copia Drive pendiente"); return; }
        setSyncStatus("Sincronizando...");
        try {
          const fileContent = JSON.stringify({ profile: currentProfile, logs: updatedLogs, updatedAt: new Date().toISOString() }, null, 2);
          const fileName = `entreno_backup_${currentProfile}.json`;

          const parentQuery = folderId ? `'${folderId}' in parents and ` : '';
          const searchRes = await checkedFetch(
            `https://www.googleapis.com/drive/v3/files?q=${parentQuery}name='${fileName}' and mimeType='application/json' and trashed=false`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
          );
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            const fileId = searchData.files[0].id;
            await checkedFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
              body: fileContent
            });
          } else {
            const metadata = { name: fileName, mimeType: 'application/json', ...(folderId ? { parents: [folderId] } : {}) };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));
            await checkedFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}` },
              body: form
            });
          }
          setSyncStatus("Sincronizado ✔️");
        } catch (err) { setSyncStatus("Error Sincronización ⚠️"); }
      };

      const handleWeightChange = (exId, delta) => {
        setInputs(prev => {
          const current = prev[exId] || defaultInput(exId);
          const newPeso = Math.max(0, +(current.peso + delta).toFixed(2));
          return { ...prev, [exId]: { ...current, peso: newPeso } };
        });
      };

      const handleStepChange = (exId, field, delta) => {
        setInputs(prev => {
          const current = prev[exId] || defaultInput(exId);
          let val = current[field] + delta;
          if (field === 'reps') val = Math.max(1, val);
          if (field === 'rir') val = Math.max(0, Math.min(5, val));
          return { ...prev, [exId]: { ...current, [field]: val } };
        });
      };

      const checkAndTriggerPR = (exId, exName, newPeso, newReps) => {
        const exLogs = logs[exId] || [];
        let isPR = false;
        if (exLogs.length === 0) {
          isPR = true;
        } else {
          const maxPreviousWeight = Math.max(...exLogs.map(e => e.peso || 0));
          if (newPeso > maxPreviousWeight) {
            isPR = true;
          } else {
            const sameWeightLogs = exLogs.filter(e => e.peso === newPeso);
            if (sameWeightLogs.length > 0) {
              const maxRepsAtWeight = Math.max(...sameWeightLogs.map(e => e.reps || 0));
              if (newReps > maxRepsAtWeight) isPR = true;
            }
          }
        }

        if (isPR) {
          setLastPrMessage(`🏆 ¡NUEVO PR en ${exName}! (${newPeso}kg × ${newReps} reps)`);
          setTimeout(() => setLastPrMessage(null), 4000);
        }
      };

      const handleSaveSet = (ex) => {
        const exId = ex.id;
        const setInput = inputs[exId] || defaultInput(exId);
        
        if (saveLock.current || loadFailed.current) return;
        saveLock.current = true;
        const newEntry = { fecha: localDate(), timestamp: new Date().toISOString(),
          hora: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
          rutina: routine, dia: activeTab, ejercicio: ex.nombre, modo: trainingMode, ...setInput };
        const newLogs = {...logs, [exId]: [newEntry, ...(logs[exId] || [])]};
        try {
          localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs));
        } catch (error) {
          setSaveStatus("No se pudo guardar. La serie no se ha marcado. Libera espacio o exporta tus datos.");
          saveLock.current = false;
          return;
        }
        setLogs(newLogs);
        setSaveStatus("Serie guardada en este dispositivo");
        checkAndTriggerPR(exId, ex.nombre, setInput.peso, setInput.reps);
        syncToDriveCloud(newLogs);
        setTimeout(() => { saveLock.current = false; }, 600);

        setFlashExId(exId);
        setTimeout(() => setFlashExId(null), 600);

        startTimerWithSeconds(ex.rest || currentMode.restDefault, ex.nombre);
      };

      const handleDeleteSet = (exId, index) => {
        const newLogs = { ...logs, [exId]: [...(logs[exId] || [])] };
        if (loadFailed.current) return;
        if (newLogs[exId]) {
          newLogs[exId].splice(index, 1);
          if (newLogs[exId].length === 0) delete newLogs[exId];
          try { localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs)); } catch { setSaveStatus("No se pudo guardar la eliminación."); return; }
          setLogs(newLogs);
          syncToDriveCloud(newLogs);
        }
      };

      const handleAddProfile = () => {
        const name = prompt("Nombre del nuevo perfil:");
        if (name && !profiles.includes(name)) {
          const updated = [...profiles, name];
          try { localStorage.setItem("entreno_profiles", JSON.stringify(updated)); } catch { setSaveStatus("No se pudo guardar el perfil"); return; }
          setProfiles(updated);
          setCurrentProfile(name);
        }
      };

      const getPlateBreakdown = (totalKg) => {
        const bar = 20;
        if (!totalKg || totalKg <= bar) return "Barra (20kg)";
        let rem = (totalKg - bar) / 2;
        if (rem <= 0) return "Barra (20kg)";
        const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
        let res = [];
        for (let p of plates) {
          while (rem >= p - 0.001) {
            res.push(p);
            rem = Math.round((rem - p) * 100) / 100;
          }
        }
        const counts = {};
        res.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        const txt = Object.keys(counts).sort((a, b) => b - a).map(k => `${counts[k]}x${k}k`).join('+');
        return `${txt} / lado`;
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const dayConfig = ROUTINE_VARIANTS[activeTab];
      const currentExercises = dayConfig ? dayConfig[weekVariant] : [];

      const todayDate = localDate();
      let totalSessionSets = 0;
      let totalSessionVolume = 0;

      // Calcular volumen por grupo muscular para la matriz analítica
      const muscleVolumeMap = {};

      if (dayConfig) {
        const allPossibleEx = currentExercises;
        allPossibleEx.forEach(ex => {
          const exLogs = logs[ex.id] || [];
          const todayLogs = exLogs.filter(e => e.fecha === todayDate && e.rutina === routine && e.dia === activeTab);
          totalSessionSets += todayLogs.length;
          todayLogs.forEach(entry => {
            const vol = (entry.peso || 0) * (entry.reps || 0);
            totalSessionVolume += vol;
            if (ex.grupo) {
              muscleVolumeMap[ex.grupo] = (muscleVolumeMap[ex.grupo] || 0) + 1;
            }
          });
        });
      }

      return (
        <div className="min-h-screen bg-black text-slate-100 flex flex-col pb-36 selection:bg-emerald-500 selection:text-black">
          
          <div className="max-w-lg mx-auto w-full px-4 pt-4">
            <label className="text-sm text-neutral-300">Rutina
              <select aria-label="Rutina" value={routine} onChange={e => {setRoutine(e.target.value); setActiveTab("lunes");setInputs({});setExpandedEx({});}} className="ml-3 p-3 rounded-xl bg-neutral-900 border border-emerald-400 text-white">
                <option value="cuatro">4 días</option><option value="cinco">5 días</option>
              </select>
            </label>
            <p className="text-xs text-neutral-400 mt-2">Elige el día que quieras hacer. Se guarda la fecha real.</p>
            <p role="status" className="text-sm text-emerald-300 mt-2">{saveStatus}</p>
          </div>
          <header className="border-b border-white/5 bg-black/90 backdrop-blur-2xl px-4 py-3 sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xs mono shadow-[0_0_15px_rgba(16,185,129,0.25)]">
                  ⚡
                </div>
                <div>
                  <h1 className="text-emerald-400 font-extrabold text-sm tracking-tight mono leading-none">ENTRENO PRO</h1>
                  <span className="text-[9px] text-neutral-400 font-bold tracking-widest uppercase">PRUEBA · REGISTRO SIMPLE</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowGlossary(true)}
                  className="bg-neutral-900/90 border border-emerald-500/40 text-xs px-2.5 py-1.5 rounded-xl text-emerald-400 font-black flex items-center gap-1 shadow-[0_0_10px_rgba(16,185,129,0.15)]"
                >
                  <span>❓</span>
                </button>
                <select 
                  value={currentProfile}
                  onChange={(e) => setCurrentProfile(e.target.value)}
                  className="bg-neutral-900/90 border border-white/10 text-xs font-bold rounded-xl px-2 py-1.5 text-slate-200 outline-none focus:border-emerald-500"
                >
                  {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <button 
                  onClick={handleAddProfile}
                  className="bg-neutral-900/90 border border-white/10 text-xs px-2.5 py-1.5 rounded-xl hover:bg-neutral-800 text-emerald-400 font-black"
                >
                  +
                </button>
              </div>
            </div>
          </header>

          {lastPrMessage && (
            <div className="fixed top-16 left-4 right-4 z-50 max-w-md mx-auto bg-amber-400 text-black font-black text-xs px-4 py-3 rounded-2xl shadow-[0_0_30px_rgba(251,191,36,0.6)] flex items-center justify-center gap-2 pr-badge text-center">
              <span>{lastPrMessage}</span>
            </div>
          )}

          {showGlossary && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card border border-emerald-500/40 rounded-3xl p-5 max-w-md w-full space-y-4 shadow-2xl animate-fadeIn">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-emerald-400 font-black text-sm uppercase tracking-wider flex items-center gap-2">
                    <span>📖</span> Matriz Muscular & Sobrecarga
                  </h3>
                  <button 
                    onClick={() => setShowGlossary(false)}
                    className="w-8 h-8 rounded-xl bg-neutral-900 text-neutral-400 hover:text-white flex items-center justify-center font-black"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 max-h-[60vh] overflow-y-auto pr-1">
                  <div className="bg-neutral-900/90 p-3 rounded-2xl border border-white/5 space-y-1">
                    <strong className="text-emerald-400 font-extrabold">Matriz de Volumen Muscular:</strong>
                    <p className="text-neutral-400 text-[11px]">Controla en tiempo real las series efectivas asignadas a cada grupo muscular durante tu sesión actual.</p>
                  </div>
                </div>

                <button 
                  onClick={() => setShowGlossary(false)}
                  className="w-full bg-emerald-400 text-black font-black py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-400/20"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

          {activeTab !== "stats" && activeTab !== "progreso" && dayConfig && (
            <div className="max-w-4xl mx-auto w-full px-4 pt-3 space-y-2">
              
              <div className="glass-card rounded-2xl p-3 flex items-center justify-between border border-white/10 shadow-xl">
                <div>
                  <div className="text-[9px] font-black uppercase tracking-widest text-neutral-400">SESIÓN ACTIVA</div>
                  <div className="text-xs font-extrabold text-slate-200 mt-0.5">{dayConfig.label} · <span className="text-emerald-400">{dayConfig.musculo}</span></div>
                  <div className="text-[9px] text-cyan-400 font-semibold mt-0.5">{currentExercises.length} ejercicios · {routine === 'cuatro' ? '4' : '5'} días</div>
                </div>
                <div className="flex items-center gap-4 text-right">
                  <div>
                    <div className="text-[9px] font-black uppercase tracking-widest text-cyan-400 mono">VOLUMEN</div>
                    <div className="text-xs font-black mono text-white">{totalSessionVolume.toLocaleString()} <span className="text-neutral-500 text-[9px]">kg</span></div>
                  </div>
                  <div>
                    <div className="text-[9px] font-black uppercase tracking-widest text-emerald-400 mono">SERIES</div>
                    <div className="text-xs font-black mono text-white">{totalSessionSets} <span className="text-neutral-500 text-[9px]">hechas</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          <main className="max-w-4xl mx-auto w-full px-4 py-3 flex-1">
            {activeTab === "stats" ? (
              <div className="space-y-4">
                <div className="glass-card rounded-3xl p-5 shadow-2xl border border-cyan-500/30">
                  <h3 className="text-xs font-black uppercase tracking-widest text-cyan-400 mb-3 flex items-center gap-2">
                    <span>📊</span> Matriz de Volumen & PRs ({currentProfile})
                  </h3>
                  
                  {Object.keys(logs).length === 0 ? (
                    <p className="text-xs text-neutral-500 italic">Registra series para activar la analítica muscular.</p>
                  ) : (
                    <div className="space-y-3">
                      {Object.entries(logs).map(([exId, entries]) => {
                        const maxWeight = Math.max(...entries.map(e => e.peso || 0));
                        const totalExVolume = entries.reduce((acc, e) => acc + ((e.peso || 0) * (e.reps || 0)), 0);
                        return (
                          <div key={exId} className="bg-neutral-900/90 p-3.5 rounded-2xl border border-white/5 flex items-center justify-between">
                            <div>
                              <div className="text-xs font-black text-white uppercase tracking-wider">{exId.replace('-', ' ')}</div>
                              <div className="text-[10px] text-neutral-400 mt-1 mono">
                                Series: <strong className="text-slate-200">{entries.length}</strong> · Tonelaje: <strong className="text-cyan-400">{totalExVolume.toLocaleString()} kg</strong>
                              </div>
                            </div>
                            <div className="text-right">
                              <span className="text-[10px] font-black text-amber-400 mono bg-amber-950/40 px-2.5 py-1 rounded-xl border border-amber-500/30">
                                🏆 {maxWeight} kg
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            ) : activeTab === "progreso" ? (
              <div className="space-y-4">
                <div className="glass-card rounded-3xl p-6 shadow-2xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-emerald-400 mb-2">Sincronización Aislada de Drive</h3>
                  <p className="text-xs text-neutral-400 mb-4">
                    Estado: <strong className="text-slate-200 font-bold">{syncStatus}</strong>
                  </p>
                  {!accessToken ? (
                    <button 
                      onClick={handleGoogleLogin}
                      className="bg-sky-400 text-black font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg shadow-sky-400/20 hover:bg-sky-300 transition"
                    >
                      Conectar Google Drive (/ENTRENO_PRO_DATA/)
                    </button>
                  ) : (
                    <p className="text-xs text-emerald-300 font-bold">¡Conectado! Archivos resguardados en /ENTRENO_PRO_DATA/.</p>
                  )}
                </div>
              </div>
            ) : (
              dayConfig && (
                <div className="space-y-3">
                  {currentExercises.map((ex) => {
                    const isExpanded = expandedEx[ex.id];
                    const isHelpOpen = showHelp[ex.id];
                    const exInput = inputs[ex.id] || defaultInput(ex.id);
                    const exLogs = logs[ex.id] || [];
                    const isFlashing = flashExId === ex.id;
                    const todayLogs = exLogs.filter(e => e.fecha === todayDate && e.rutina === routine && e.dia === activeTab);
                    const completedSetsCount = todayLogs.length;
                    const lastSet = exLogs[0];
                    const maxExWeight = exLogs.length > 0 ? Math.max(...exLogs.map(e => e.peso || 0)) : 0;

                    return (
                      <div key={ex.id} className={`glass-card rounded-2xl overflow-hidden shadow-2xl transition-all ${isFlashing ? 'saved-flash border-emerald-500 bg-emerald-950/20' : ''}`}>
                        
                        <button 
                          onClick={() => setExpandedEx(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                          className="w-full text-left p-3 flex justify-between items-center gap-3 active:bg-white/5 transition"
                        >
                          <div className="flex-1">
                            <div className="flex items-center justify-between gap-2">
                              <div className="flex items-center gap-2">
                                <h3 className="text-xs font-black tracking-tight text-emerald-400 uppercase">{ex.nombre}</h3>
                                {maxExWeight > 0 && (
                                  <span className="text-[9px] font-bold text-amber-400 mono bg-amber-950/40 px-1.5 py-0.5 rounded border border-amber-500/20">
                                    PR: {maxExWeight}kg
                                  </span>
                                )}
                              </div>
                              
                              <div className="flex items-center gap-1">
                                {Array.from({ length: ex.series }).map((_, i) => (
                                  <div 
                                    key={i} 
                                    className={`w-2 h-2 rounded-full transition-all ${i < completedSetsCount ? 'bg-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.9)] scale-110' : 'bg-neutral-800 border border-neutral-700'}`} 
                                  />
                                ))}
                              </div>
                            </div>

                            <div className="mt-1 text-[10px] text-neutral-400 flex items-center justify-between font-medium">
                              <div className="flex items-center gap-1.5">
                                <span className="text-slate-200 font-bold">{ex.series} series · {ex.reps} reps · RIR {ex.rir}{ex.rir === "0" ? " (fallo en última serie)" : ""} · {formatTime(ex.rest)} descanso</span>
                                <span>·</span>
                                <span className="text-cyan-400 uppercase font-bold">{ex.grupo}</span>
                              </div>
                              
                              {!isExpanded && lastSet && (
                                <span className="text-emerald-300 mono text-[9px] font-extrabold bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-500/30">
                                  Último: {lastSet.peso}kg × {lastSet.reps}
                                </span>
                              )}
                            </div>
                          </div>
                        </button>

                        {isExpanded && (
                          <div className="px-3 pb-3 pt-1 border-t border-white/5 bg-black/40 space-y-2.5 text-xs">
                            
                            {ex.como && ex.como.length > 0 && (
                              <div>
                                <button
                                  onClick={() => setShowHelp(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                                  className="w-full bg-neutral-900/80 border border-white/10 hover:border-emerald-500/40 text-neutral-400 font-bold py-1 px-2.5 rounded-xl flex items-center justify-between text-[10px] transition"
                                >
                                  <span className="flex items-center gap-1.5 text-emerald-400">
                                    <span>💡</span> Guía Técnica
                                  </span>
                                  <span className="text-neutral-500">{isHelpOpen ? '▲ Ocultar' : '▼ Ver'}</span>
                                </button>

                                {isHelpOpen && (
                                  <div className="grid grid-cols-1 gap-2 mt-2">
                                    <div className="bg-emerald-950/20 border border-emerald-500/20 rounded-xl p-2.5">
                                      <span className="text-[9px] font-black text-emerald-400 uppercase">Técnica Clave</span>
                                      <ul className="list-disc list-inside text-slate-300 mt-0.5 space-y-0.5 text-[10px]">
                                        {ex.como.map((c, i) => <li key={i}>{c}</li>)}
                                      </ul>
                                    </div>
                                    {ex.errores && (
                                      <div className="bg-rose-950/20 border border-rose-500/20 rounded-xl p-2.5">
                                        <span className="text-[9px] font-black text-rose-400 uppercase">Errores a Evitar</span>
                                        <ul className="list-disc list-inside text-neutral-400 mt-0.5 space-y-0.5 text-[10px]">
                                          {ex.errores.map((e, i) => <li key={i}>{e}</li>)}
                                        </ul>
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            )}

                            {todayLogs.length > 0 && (
                              <div className="space-y-1">
                                <span className="font-black text-[9px] text-emerald-400 uppercase tracking-widest">SERIES COMPLETADAS</span>
                                <div className="space-y-1">
                                  {todayLogs.map((set, sIndex) => {
                                    const originalIndex = exLogs.findIndex(item => item === set);
                                    return (
                                      <div key={sIndex} className="flex items-center justify-between bg-neutral-900/90 border border-white/10 rounded-xl px-3 py-1.5 mono text-xs">
                                        <div className="flex items-center gap-2.5">
                                          <span className="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 font-black flex items-center justify-center text-[9px]">
                                            #{todayLogs.length - sIndex}
                                          </span>
                                          <span className="font-extrabold text-white">{set.peso} kg</span>
                                          <span className="text-neutral-500">×</span>
                                          <span className="font-extrabold text-slate-200">{set.reps} reps</span>
                                          <span className="text-neutral-500 text-[9px]">(RIR {set.rir})</span>
                                        </div>
                                        <button 
                                          onClick={() => handleDeleteSet(ex.id, originalIndex)}
                                          className="text-neutral-500 hover:text-rose-400 font-black px-1"
                                        >
                                          ✕
                                        </button>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            )}

                            <div className="bg-neutral-950/90 border border-emerald-500/30 rounded-2xl p-2.5 space-y-2">
                              <div className="flex items-center justify-between">
                                <span className="font-black text-[9px] text-emerald-400 uppercase tracking-widest">NUEVA SERIE [{currentMode.label}]</span>
                                {lastSet && (
                                  <span className="text-[9px] text-cyan-300 mono font-bold bg-cyan-950/50 px-2 py-0.5 rounded-lg border border-cyan-500/30">
                                    Ant: {lastSet.peso}kg × {lastSet.reps}
                                  </span>
                                )}
                              </div>

                              <div className="flex items-center gap-2">
                                
                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">PESO (KG)</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleWeightChange(ex.id, -2.5)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-emerald-400 mono">{exInput.peso}</span>
                                    <button onClick={() => handleWeightChange(ex.id, 2.5)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">REPS</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleStepChange(ex.id, 'reps', -1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-white mono">{exInput.reps}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'reps', 1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">RIR</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleStepChange(ex.id, 'rir', -1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-white mono">{exInput.rir}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'rir', 1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <button 
                                  onClick={() => handleSaveSet(ex)}
                                  className="h-12 px-3 bg-emerald-400 hover:bg-emerald-300 active:scale-95 text-black font-black rounded-xl text-lg flex items-center justify-center shadow-lg shadow-emerald-400/30 transition"
                                  title="Serie hecha" aria-label="Serie hecha: guardar e iniciar descanso"
                                >
                                  Hecha
                                </button>

                              </div>

                              <div className="text-[9px] mono text-cyan-400 text-right px-0.5 font-semibold">
                                ⚖️ {getPlateBreakdown(exInput.peso)}
                              </div>
                            </div>

                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>

          <nav className="glass-nav fixed bottom-0 left-0 right-0 z-40 px-3 py-2">
            <div className="max-w-md mx-auto flex items-center justify-around gap-1">
              {Object.keys(ROUTINE_VARIANTS).map(dayKey => {
                const d = ROUTINE_VARIANTS[dayKey];
                return (
                  <button
                    key={dayKey}
                    onClick={() => setActiveTab(dayKey)}
                    className={`flex-1 py-1.5 px-1 rounded-xl text-[10px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === dayKey ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
                  >
                    <span className="tracking-tighter">{d.label}</span>
                    <span className="text-[8px] opacity-70 font-medium">{d.sub}</span>
                  </button>
                );
              })}
              <button
                onClick={() => setActiveTab("stats")}
                className={`flex-1 py-1.5 px-1 rounded-xl text-[10px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === "stats" ? 'bg-cyan-400 text-black shadow-[0_0_15px_rgba(34,211,238,0.4)]' : 'text-neutral-400 hover:text-white'}`}
              >
                <span className="tracking-tighter">STATS</span>
                <span className="text-[8px] opacity-70 font-medium">PRO</span>
              </button>
              <button
                onClick={() => setActiveTab("progreso")}
                className={`flex-1 py-1.5 px-1 rounded-xl text-[10px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === "progreso" ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
              >
                <span className="tracking-tighter">CLOUD</span>
                <span className="text-[8px] opacity-70 font-medium">DRIVE</span>
              </button>
            </div>
          </nav>

          {timer.active && (
            <div className="fixed bottom-16 left-3 right-3 max-w-lg mx-auto glass-card border border-emerald-500/60 rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-2 z-50">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 mono font-black text-sm">
                  ⏱️
                </div>
                <div>
                  <div className="text-[9px] font-extrabold text-neutral-400 uppercase">{timer.exName}</div>
                  <div className="text-lg font-black mono text-emerald-400 leading-none mt-0.5">
                    {formatTime(timer.secondsLeft)}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button 
                  onClick={() => adjustTimerTime(-30)}
                  className="bg-neutral-900 border border-white/10 text-[10px] font-bold px-2.5 py-1.5 rounded-lg text-slate-300"
                >
                  -30s
                </button>
                <button 
                  onClick={() => adjustTimerTime(30)}
                  className="bg-neutral-900 border border-white/10 text-[10px] font-bold px-2.5 py-1.5 rounded-lg text-slate-300"
                >
                  +30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, active: false }))}
                  className="bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs font-black w-8 h-8 rounded-lg flex items-center justify-center ml-0.5"
                >
                  ✕
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
