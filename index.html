    function App() {
      const [activeTab, setActiveTab] = React.useState("lunes");
      const [isFocus, setIsFocus] = React.useState(false);
      const [profiles, setProfiles] = React.useState(["Perfil Principal"]);
      const [currentProfile, setCurrentProfile] = React.useState("Perfil Principal");
      const [logs, setLogs] = React.useState({});
      const [expandedEx, setExpandedEx] = React.useState({});
      const [inputs, setInputs] = React.useState({});
      const [syncStatus, setSyncStatus] = React.useState("Desconectado de Drive");
      const [accessToken, setAccessToken] = React.useState(null);

      // Cargar logs locales por perfil
      React.useEffect(() => {
        const saved = localStorage.getItem(`entreno_logs_${currentProfile}`);
        if (saved) {
          try { setLogs(JSON.parse(saved)); } catch(e){}
        } else {
          setLogs({});
        }
      }, [currentProfile]);

      // Función para autenticar con Google Drive (OAuth 2.0 / GIS)
      const handleGoogleLogin = () => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              setSyncStatus("Conectado a Drive ☁️ (Auto-sync activo)");
              alert("¡Conectado correctamente con Google Drive!");
            }
          },
        });
        client.requestAccessToken();
      };

      // Sincronización automática a Google Drive en segundo plano
      const syncToDriveCloud = async (updatedLogs) => {
        if (!accessToken) return; // Si no hay sesión iniciada, solo actúa localmente
        setSyncStatus("Sincronizando con Drive...");
        try {
          const fileContent = JSON.stringify({ profile: currentProfile, logs: updatedLogs, updatedAt: new Date().toISOString() }, null, 2);
          const fileName = `entreno_backup_${currentProfile}.json`;

          // Buscar si el archivo ya existe en Drive
          const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and mimeType='application/json'`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            // Actualizar archivo existente
            const fileId = searchData.files[0].id;
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
              body: fileContent
            });
          } else {
            // Crear archivo nuevo
            const metadata = { name: fileName, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}` },
              body: form
            });
          }
          setSyncStatus("Sincronizado con Drive ✔️");
        } catch (err) {
          setSyncStatus("Error al sincronizar con Drive ⚠️");
        }
      };

      // Alternar Modo FOCUS
      const toggleFocus = () => {
        const newFocus = !isFocus;
        setIsFocus(newFocus);
        if (newFocus) {
          document.body.classList.add('focus-mode');
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else {
          document.body.classList.remove('focus-mode');
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        }
      };

      const handleWeightChange = (exId, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: 6, rir: 2 };
          const newPeso = Math.max(0, +(current.peso + delta).toFixed(2));
          return { ...prev, [exId]: { ...current, peso: newPeso } };
        });
      };

      const handleSaveSet = (exId) => {
        const setInput = inputs[exId] || { peso: 50, reps: 6, rir: 2 };
        const newLogs = { ...logs };
        if (!newLogs[exId]) newLogs[exId] = [];
        const newEntry = {
          fecha: new Date().toISOString().split('T')[0],
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          ...setInput
        };
        newLogs[exId].unshift(newEntry);
        setLogs(newLogs);
        
        // Guardado local
        localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs));
        
        // Sincronización automática a la nube en tiempo real
        syncToDriveCloud(newLogs);
      };

      const handleAddProfile = () => {
        const name = prompt("Nombre del nuevo perfil:");
        if (name && !profiles.includes(name)) {
          const updated = [...profiles, name];
          setProfiles(updated);
          setCurrentProfile(name);
        }
      };

      const currentDay = ROUTINE_DATA.find(d => d.id === activeTab);

      return (
        <div className="min-h-screen bg-[#0b111e] text-slate-100 flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-[#0f172a] px-4 py-3 sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-extrabold text-lg tracking-wider">ENTRENO</span>
                <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/20">PRO 2026</span>
              </div>

              <div className="flex items-center gap-2">
                {/* Selector de Perfil */}
                <select 
                  value={currentProfile}
                  onChange={(e) => setCurrentProfile(e.target.value)}
                  className="bg-slate-800 border border-slate-700 text-xs rounded px-2 py-1 text-slate-200"
                >
                  {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <button 
                  onClick={handleAddProfile}
                  className="bg-slate-800 border border-slate-700 text-xs px-2 py-1 rounded hover:bg-slate-700"
                >
                  +
                </button>

                {/* Botón FOCUS */}
                <button 
                  onClick={toggleFocus}
                  className={`text-xs font-bold px-3 py-1.5 rounded transition ${isFocus ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 border border-slate-700 text-slate-200'}`}
                >
                  {isFocus ? 'SALIR FOCUS' : 'FOCUS'}
                </button>
              </div>
            </div>
          </header>

          {/* Navegación por Días / Progreso */}
          <div className="tabs-bar bg-[#0f172a]/80 border-b border-slate-800/80 px-4 py-2 sticky top-[53px] z-20 backdrop-blur">
            <div className="max-w-4xl mx-auto flex gap-1.5 overflow-x-auto pb-1">
              {ROUTINE_DATA.map(day => (
                <button
                  key={day.id}
                  onClick={() => { setActiveTab(day.id); }}
                  className={`px-3 py-1.5 rounded text-xs font-bold whitespace-nowrap transition ${activeTab === day.id ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800'}`}
                >
                  {day.label} <span className="opacity-60 text-[10px]">{day.sub.split(' ')[1]}</span>
                </button>
              ))}
              <button
                onClick={() => setActiveTab("progreso")}
                className={`px-3 py-1.5 rounded text-xs font-bold whitespace-nowrap ml-auto transition ${activeTab === "progreso" ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800/60 text-slate-400'}`}
              >
                ☁ PROGRESO / DRIVE
              </button>
            </div>
          </div>

          {/* Contenido Principal */}
          <main className="max-w-4xl mx-auto w-full px-4 py-6 flex-1">
            {activeTab === "progreso" ? (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-emerald-400 mb-2">Sincronización Automática en Google Drive</h3>
                  <p className="text-xs text-slate-400 mb-4">
                    Estado actual: <strong className="text-emerald-400">{syncStatus}</strong>
                  </p>
                  {!accessToken ? (
                    <button 
                      onClick={handleGoogleLogin}
                      className="bg-sky-500 text-slate-950 font-bold text-xs px-4 py-2 rounded shadow hover:bg-sky-400"
                    >
                      Conectar cuenta de Google Drive
                    </button>
                  ) : (
                    <p className="text-xs text-emerald-300">¡Tu cuenta está vinculada! Cada vez que guardes una serie, los datos se actualizarán automáticamente en tu Drive.</p>
                  )}
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 mb-4">Historial de Registros - {currentProfile}</h3>
                  {Object.keys(logs).length === 0 ? (
                    <p className="text-xs text-slate-500">No hay series registradas aún para este perfil.</p>
                  ) : (
                    <div className="space-y-4">
                      {Object.entries(logs).map(([exId, entries]) => (
                        <div key={exId} className="border-b border-slate-800 pb-3">
                          <div className="text-xs font-bold text-emerald-400 uppercase">{exId.replace('-', ' ')}</div>
                          <div className="mt-1 space-y-1">
                            {entries.map((e, idx) => (
                              <div key={idx} className="text-xs text-slate-300 flex justify-between font-mono bg-slate-950/40 px-2 py-1 rounded">
                                <span>{e.fecha} {e.hora}</span>
                                <span className="font-bold text-emerald-400">{e.peso} kg × {e.reps} reps (RIR {e.rir})</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              currentDay && (
                <div className="space-y-4">
                  <div className="flex items-baseline justify-between px-1">
                    <h2 className="text-xs font-bold uppercase tracking-widest text-slate-400">
                      {currentDay.label} · {currentDay.sub}
                    </h2>
                    <span className="text-xs text-slate-500">{currentDay.ejercicios.length} ejercicios</span>
                  </div>

                  {currentDay.ejercicios.map((ex) => {
                    const isExpanded = expandedEx[ex.id];
                    const exInput = inputs[ex.id] || { peso: 50, reps: 6, rir: 2 };
                    const exLogs = logs[ex.id] || [];

                    return (
                      <div key={ex.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                        <button 
                          onClick={() => setExpandedEx(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                          className="w-full text-left p-4 flex justify-between items-start gap-4 hover:bg-slate-800/40 transition"
                        >
                          <div>
                            <h3 className="text-base font-extrabold tracking-tight text-slate-100 uppercase">{ex.nombre}</h3>
                            <div className="mt-1 text-xs text-slate-400 flex flex-wrap gap-2">
                              <span>{ex.series} series</span>
                              <span>·</span>
                              <span>{ex.repeticiones} reps</span>
                              <span>·</span>
                              <span>RIR {ex.rir}</span>
                              <span>·</span>
                              <span>Descanso {ex.descanso}</span>
                            </div>
                          </div>
                          <div className={`w-6 h-6 rounded-full border border-slate-700 flex items-center justify-center text-xs transition-transform ${isExpanded ? 'rotate-180 bg-emerald-500/10 text-emerald-400' : 'text-slate-400'}`}>
                            ↓
                          </div>
                        </button>

                        {isExpanded && (
                          <div className="px-4 pb-4 pt-1 border-t border-slate-800 bg-slate-950/50 space-y-4 text-xs">
                            {/* Guía Técnica */}
                            <div className="space-y-2 mt-2">
                              <div>
                                <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">TÉCNICA</span>
                                <ul className="list-disc list-inside text-slate-300 mt-1 space-y-0.5">
                                  {ex.como.map((c, i) => <li key={i}>{c}</li>)}
                                </ul>
                              </div>
                              <div>
                                <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider">EVITAR</span>
                                <ul className="list-disc list-inside text-slate-400 mt-1 space-y-0.5">
                                  {ex.errores.map((e, i) => <li key={i}>{e}</li>)}
                                </ul>
                              </div>
                            </div>

                            {/* Controles de Entrada / Registro de Serie */}
                            <div className="bg-slate-900 border border-slate-800 p-3 rounded-lg space-y-3">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-slate-300">REGISTRAR SERIE</span>
                                {exLogs[0] && (
                                  <span className="text-[10px] text-slate-500 font-mono">
                                    Último: {exLogs[0].peso}kg × {exLogs[0].reps} (RIR{exLogs[0].rir})
                                  </span>
                                )}
                              </div>

                              <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-slate-400 font-medium">Peso:</span>
                                <button onClick={() => handleWeightChange(ex.id, -2.5)} className="bg-slate-800 px-2 py-1 rounded border border-slate-700 font-mono">-2.5</button>
                                <button onClick={() => handleWeightChange(ex.id, -1.25)} className="bg-slate-800 px-2 py-1 rounded border border-slate-700 font-mono">-1.25</button>
                                <div className="bg-slate-950 border border-emerald-500/40 px-3 py-1 rounded font-bold text-emerald-400 text-sm">
                                  {exInput.peso} kg
                                </div>
                                <button onClick={() => handleWeightChange(ex.id, 1.25)} className="bg-slate-800 px-2 py-1 rounded border border-slate-700 font-mono">+1.25</button>
                                <button onClick={() => handleWeightChange(ex.id, 2.5)} className="bg-slate-800 px-2 py-1 rounded border border-slate-700 font-mono">+2.5</button>
                              </div>

                              <button 
                                onClick={() => handleSaveSet(ex.id)}
                                className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-2 rounded text-xs tracking-wider uppercase transition shadow"
                              >
                                GUARDAR · {exInput.peso}kg × {exInput.reps} RIR{exInput.rir}
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
