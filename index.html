    function App() {
      const [activeTab, setActiveTab] = React.useState("lunes");
      const [isFocus, setIsFocus] = React.useState(false);
      const [profiles, setProfiles] = React.useState(["Perfil Principal"]);
      const [currentProfile, setCurrentProfile] = React.useState("Perfil Principal");
      const [logs, setLogs] = React.useState({});
      const [expandedEx, setExpandedEx] = React.useState({});
      const [inputs, setInputs] = React.useState({});
      const [syncStatus, setSyncStatus] = React.useState("Desconectado de Drive");
      const [accessToken, setAccessToken] = React.useState(null);
      const [flashExId, setFlashExId] = React.useState(null);
      const [timer, setTimer] = React.useState({ active: false, secondsLeft: 0, totalSeconds: 0, exName: "" });

      React.useEffect(() => {
        const saved = localStorage.getItem(`entreno_logs_${currentProfile}`);
        if (saved) {
          try { setLogs(JSON.parse(saved)); } catch(e){}
        } else {
          setLogs({});
        }
      }, [currentProfile]);

      React.useEffect(() => {
        let interval = null;
        if (timer.active && timer.secondsLeft > 0) {
          interval = setInterval(() => {
            setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft - 1 }));
          }, 1000);
        } else if (timer.secondsLeft === 0 && timer.active) {
          setTimer(prev => ({ ...prev, active: false }));
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
        return () => clearInterval(interval);
      }, [timer.active, timer.secondsLeft]);

      const handleGoogleLogin = () => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              setSyncStatus("Conectado a Drive ☁️ (Auto-sync activo)");
              alert("¡Conectado correctamente con Google Drive!");
            }
          },
        });
        client.requestAccessToken();
      };

      const syncToDriveCloud = async (updatedLogs) => {
        if (!accessToken) return;
        setSyncStatus("Sincronizando con Drive...");
        try {
          const fileContent = JSON.stringify({ profile: currentProfile, logs: updatedLogs, updatedAt: new Date().toISOString() }, null, 2);
          const fileName = `entreno_backup_${currentProfile}.json`;

          const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and mimeType='application/json'`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            const fileId = searchData.files[0].id;
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
              body: fileContent
            });
          } else {
            const metadata = { name: fileName, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}` },
              body: form
            });
          }
          setSyncStatus("Sincronizado con Drive ✔️");
        } catch (err) {
          setSyncStatus("Error al sincronizar con Drive ⚠️");
        }
      };

      const toggleFocus = () => {
        const newFocus = !isFocus;
        setIsFocus(newFocus);
        if (newFocus) {
          document.body.classList.add('focus-mode');
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } else {
          document.body.classList.remove('focus-mode');
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        }
      };

      const handleWeightChange = (exId, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: 6, rir: 2 };
          const newPeso = Math.max(0, +(current.peso + delta).toFixed(2));
          return { ...prev, [exId]: { ...current, peso: newPeso } };
        });
      };

      const handleStepChange = (exId, field, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: 6, rir: 2 };
          let val = current[field] + delta;
          if (field === 'reps') val = Math.max(1, val);
          if (field === 'rir') val = Math.max(0, Math.min(5, val));
          return { ...prev, [exId]: { ...current, [field]: val } };
        });
      };

      const handleSaveSet = (ex) => {
        const exId = ex.id;
        const setInput = inputs[exId] || { peso: 50, reps: 6, rir: 2 };
        const newLogs = { ...logs };
        if (!newLogs[exId]) newLogs[exId] = [];
        const newEntry = {
          fecha: new Date().toISOString().split('T')[0],
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          ...setInput
        };
        newLogs[exId].unshift(newEntry);
        setLogs(newLogs);
        
        localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs));
        syncToDriveCloud(newLogs);

        setFlashExId(exId);
        setTimeout(() => setFlashExId(null), 600);

        const restSecs = parseInt(ex.descanso) || 90;
        setTimer({ active: true, secondsLeft: restSecs, totalSeconds: restSecs, exName: ex.nombre });
      };

      const handleAddProfile = () => {
        const name = prompt("Nombre del nuevo perfil:");
        if (name && !profiles.includes(name)) {
          const updated = [...profiles, name];
          setProfiles(updated);
          setCurrentProfile(name);
        }
      };

      const getPlateBreakdown = (totalKg) => {
        const bar = 20;
        if (!totalKg || totalKg <= bar) return "Solo barra (20kg)";
        let rem = (totalKg - bar) / 2;
        if (rem <= 0) return "Solo barra (20kg)";
        const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
        let res = [];
        for (let p of plates) {
          while (rem >= p - 0.001) {
            res.push(p);
            rem = Math.round((rem - p) * 100) / 100;
          }
        }
        const counts = {};
        res.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        const txt = Object.keys(counts).sort((a, b) => b - a).map(k => `${counts[k]}x${k}k`).join(' + ');
        return `${txt} por lado`;
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const currentDay = ROUTINE_DATA.find(d => d.id === activeTab);

      return (
        <div className="min-h-screen bg-[#030712] text-slate-100 flex flex-col pb-24">
          {/* Header CyberHUD */}
          <header className="border-b border-slate-800/80 bg-[#030712]/90 backdrop-blur-md px-4 py-3 sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-black text-base tracking-tighter">ENTRENO</span>
                <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-black px-2 py-0.5 rounded-md border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.15)]">PRO 2026</span>
              </div>

              <div className="flex items-center gap-2">
                <select 
                  value={currentProfile}
                  onChange={(e) => setCurrentProfile(e.target.value)}
                  className="bg-slate-900 border border-slate-800 text-xs font-semibold rounded-lg px-2.5 py-1.5 text-slate-200 outline-none focus:border-emerald-500/50"
                >
                  {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <button 
                  onClick={handleAddProfile}
                  className="bg-slate-900 border border-slate-800 text-xs px-2.5 py-1.5 rounded-lg hover:bg-slate-800 text-emerald-400 font-bold"
                >
                  +
                </button>

                <button 
                  onClick={toggleFocus}
                  className={`text-[11px] font-black px-3 py-1.5 rounded-lg transition tracking-wide ${isFocus ? 'bg-emerald-400 text-slate-950 shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:border-slate-700'}`}
                >
                  {isFocus ? 'SALIR FOCUS' : 'FOCUS'}
                </button>
              </div>
            </div>
          </header>

          {/* Navegación por Días / Progreso */}
          <div className="tabs-bar bg-[#030712]/80 border-b border-slate-800/50 px-4 py-2.5 sticky top-[53px] z-20 backdrop-blur">
            <div className="max-w-4xl mx-auto flex gap-1.5 overflow-x-auto pb-0.5 scrollbar-none">
              {ROUTINE_DATA.map(day => (
                <button
                  key={day.id}
                  onClick={() => { setActiveTab(day.id); }}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${activeTab === day.id ? 'bg-emerald-400 text-slate-950 shadow-[0_0_12px_rgba(16,185,129,0.3)]' : 'bg-slate-900/80 border border-slate-800/80 text-slate-400 hover:bg-slate-800'}`}
                >
                  {day.label} <span className="opacity-70 text-[10px] font-medium">{day.sub.split(' ')[1]}</span>
                </button>
              ))}
              <button
                onClick={() => setActiveTab("progreso")}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap ml-auto transition ${activeTab === "progreso" ? 'bg-emerald-400 text-slate-950 shadow-[0_0_12px_rgba(16,185,129,0.3)]' : 'bg-slate-900/80 border border-slate-800/80 text-slate-400'}`}
              >
                ☁ PROGRESO / DRIVE
              </button>
            </div>
          </div>

          {/* Contenido Principal */}
          <main className="max-w-4xl mx-auto w-full px-4 py-5 flex-1">
            {activeTab === "progreso" ? (
              <div className="space-y-5">
                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-sm shadow-xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-emerald-400 mb-2">Sincronización en la Nube</h3>
                  <p className="text-xs text-slate-400 mb-4">
                    Estado actual: <strong className="text-slate-200 font-semibold">{syncStatus}</strong>
                  </p>
                  {!accessToken ? (
                    <button 
                      onClick={handleGoogleLogin}
                      className="bg-sky-500 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-sky-500/20 hover:bg-sky-400 transition"
                    >
                      Conectar cuenta de Google Drive
                    </button>
                  ) : (
                    <p className="text-xs text-emerald-300 font-medium">¡Conectado! Tus registros de entrenamiento se actualizan en tiempo real.</p>
                  )}
                </div>

                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-sm shadow-xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-slate-300 mb-4">Historial de Registros ({currentProfile})</h3>
                  {Object.keys(logs).length === 0 ? (
                    <p className="text-xs text-slate-500 italic">No hay series registradas aún para este perfil.</p>
                  ) : (
                    <div className="space-y-4">
                      {Object.entries(logs).map(([exId, entries]) => (
                        <div key={exId} className="border-b border-slate-800/60 pb-3 last:border-0">
                          <div className="text-xs font-black text-emerald-400 uppercase tracking-wider">{exId.replace('-', ' ')}</div>
                          <div className="mt-1.5 space-y-1.5">
                            {entries.map((e, idx) => (
                              <div key={idx} className="text-xs text-slate-300 flex justify-between font-mono bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800/40">
                                <span className="text-slate-400">{e.fecha} {e.hora}</span>
                                <span className="font-bold text-emerald-400">{e.peso} kg × {e.reps} reps (RIR {e.rir})</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              currentDay && (
                <div className="space-y-3.5">
                  <div className="flex items-baseline justify-between px-1">
                    <h2 className="text-[11px] font-black uppercase tracking-widest text-slate-400">
                      {currentDay.label} · <span className="text-emerald-400">{currentDay.sub}</span>
                    </h2>
                    <span className="text-[11px] font-bold text-slate-500">{currentDay.ejercicios.length} ejercicios</span>
                  </div>

                  {currentDay.ejercicios.map((ex) => {
                    const isExpanded = expandedEx[ex.id];
                    const exInput = inputs[ex.id] || { peso: 50, reps: 6, rir: 2 };
                    const exLogs = logs[ex.id] || [];
                    const isFlashing = flashExId === ex.id;
                    const completedSetsCount = exLogs.filter(e => e.fecha === new Date().toISOString().split('T')[0]).length;
                    const lastSet = exLogs[0];

                    return (
                      <div key={ex.id} className={`bg-slate-900/50 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl backdrop-blur-sm transition-all ${isFlashing ? 'saved-flash border-emerald-500/60 bg-emerald-950/10' : ''}`}>
                        
                        {/* Cabecera del Ejercicio */}
                        <button 
                          onClick={() => setExpandedEx(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                          className="w-full text-left p-3.5 flex justify-between items-center gap-3 active:bg-slate-800/30 transition"
                        >
                          <div className="flex-1">
                            <div className="flex items-center justify-between gap-2">
                              <h3 className="text-sm font-black tracking-tight text-slate-100 uppercase">{ex.nombre}</h3>
                              
                              {/* Círculos de Series a la derecha */}
                              <div className="flex items-center gap-1">
                                {Array.from({ length: ex.series }).map((_, i) => (
                                  <div 
                                    key={i} 
                                    className={`w-2 h-2 rounded-full transition-all ${i < completedSetsCount ? 'bg-emerald-400 shadow-[0_0_6px_rgba(16,185,129,0.8)] scale-110' : 'bg-slate-800 border border-slate-700'}`} 
                                  />
                                ))}
                              </div>
                            </div>

                            <div className="mt-1 text-[11px] text-slate-400 flex items-center justify-between font-medium">
                              <div className="flex items-center gap-2">
                                <span className="text-emerald-400/90 font-bold">{ex.series} series</span>
                                <span>·</span>
                                <span>{ex.repeticiones} reps</span>
                                <span>·</span>
                                <span>RIR {ex.rir}</span>
                              </div>
                              
                              {/* Récord / Último registro cuando está colapsado */}
                              {!isExpanded && lastSet && (
                                <span className="text-emerald-300 font-mono text-[10px] font-extrabold bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-500/30">
                                  Último: {lastSet.peso}kg × {lastSet.reps}
                                </span>
                              )}
                            </div>
                          </div>
                        </button>

                        {/* Cuerpo Desplegado */}
                        {isExpanded && (
                          <div className="px-4 pb-4 pt-1 border-t border-slate-800/60 bg-[#020617]/40 space-y-4 text-xs">
                            
                            {/* Guía Técnica y Errores */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                              <div className="bg-emerald-950/20 border border-emerald-500/15 rounded-xl p-3">
                                <span className="text-[10px] font-black text-emerald-400 tracking-wider uppercase">Técnica Clave</span>
                                <ul className="list-disc list-inside text-slate-300 mt-1 space-y-1 text-[11px]">
                                  {ex.como.map((c, i) => <li key={i}>{c}</li>)}
                                </ul>
                              </div>
                              <div className="bg-rose-950/20 border border-rose-500/15 rounded-xl p-3">
                                <span className="text-[10px] font-black text-rose-400 tracking-wider uppercase">Errores a Evitar</span>
                                <ul className="list-disc list-inside text-slate-400 mt-1 space-y-1 text-[11px]">
                                  {ex.errores.map((e, i) => <li key={i}>{e}</li>)}
                                </ul>
                              </div>
                            </div>

                            {/* Panel HUD Táctil de Entrada con Sobrecarga Progresiva */}
                            <div className="pt-2 space-y-3">
                              <div className="flex items-center justify-between px-0.5">
                                <span className="font-black text-[10px] text-slate-400 uppercase tracking-widest">REGISTRO DE SERIE ACTIVA</span>
                                {lastSet && (
                                  <span className="text-[10px] text-cyan-300 font-mono font-bold bg-cyan-950/40 px-2 py-0.5 rounded border border-cyan-500/30">
                                    💡 Anterior: {lastSet.peso}kg × {lastSet.reps} (RIR {lastSet.rir})
                                  </span>
                                )}
                              </div>

                              {/* Fila de Peso Única */}
                              <div className="space-y-1.5">
                                <div className="flex items-center justify-between gap-1.5">
                                  <button onClick={() => handleWeightChange(ex.id, -2.5)} className="h-11 flex-1 bg-slate-800/60 active:bg-slate-700 rounded-xl border border-slate-700/70 text-xs font-black font-mono text-slate-200">-2.5</button>
                                  <button onClick={() => handleWeightChange(ex.id, -1.25)} className="h-11 flex-1 bg-slate-800/60 active:bg-slate-700 rounded-xl border border-slate-700/70 text-xs font-black font-mono text-slate-200">-1.25</button>
                                  <div className="h-12 px-3 bg-slate-950 border border-emerald-500/60 rounded-xl flex items-center justify-center font-black text-emerald-400 text-base tracking-tight shadow-[0_0_15px_rgba(16,185,129,0.2)] min-w-[100px] font-mono">
                                    {exInput.peso} kg
                                  </div>
                                  <button onClick={() => handleWeightChange(ex.id, 1.25)} className="h-11 flex-1 bg-slate-800/60 active:bg-slate-700 rounded-xl border border-slate-700/70 text-xs font-black font-mono text-slate-200">+1.25</button>
                                  <button onClick={() => handleWeightChange(ex.id, 2.5)} className="h-11 flex-1 bg-slate-800/60 active:bg-slate-700 rounded-xl border border-slate-700/70 text-xs font-black font-mono text-slate-200">+2.5</button>
                                </div>
                                <div className="text-[10px] font-mono text-cyan-400/90 text-right px-1">
                                  ⚖️ {getPlateBreakdown(exInput.peso)}
                                </div>
                              </div>

                              {/* Cuadrícula Reps & RIR */}
                              <div className="grid grid-cols-2 gap-2.5">
                                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between shadow-inner">
                                  <span className="text-[10px] font-black text-slate-400 tracking-wider">REPS</span>
                                  <div className="flex items-center gap-2">
                                    <button onClick={() => handleStepChange(ex.id, 'reps', -1)} className="w-8 h-8 bg-slate-800 active:bg-emerald-400 active:text-slate-950 rounded-lg border border-slate-700 font-black text-sm flex items-center justify-center transition">-</button>
                                    <span className="font-black text-base w-5 text-center font-mono text-white">{exInput.reps}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'reps', 1)} className="w-8 h-8 bg-slate-800 active:bg-emerald-400 active:text-slate-950 rounded-lg border border-slate-700 font-black text-sm flex items-center justify-center transition">+</button>
                                  </div>
                                </div>
                                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between shadow-inner">
                                  <span className="text-[10px] font-black text-slate-400 tracking-wider">RIR</span>
                                  <div className="flex items-center gap-2">
                                    <button onClick={() => handleStepChange(ex.id, 'rir', -1)} className="w-8 h-8 bg-slate-800 active:bg-emerald-400 active:text-slate-950 rounded-lg border border-slate-700 font-black text-sm flex items-center justify-center transition">-</button>
                                    <span className="font-black text-base w-5 text-center font-mono text-white">{exInput.rir}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'rir', 1)} className="w-8 h-8 bg-slate-800 active:bg-emerald-400 active:text-slate-950 rounded-lg border border-slate-700 font-black text-sm flex items-center justify-center transition">+</button>
                                  </div>
                                </div>
                              </div>

                              <button 
                                onClick={() => handleSaveSet(ex)}
                                className="w-full bg-emerald-400 hover:bg-emerald-300 active:scale-[0.98] text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider uppercase transition shadow-lg shadow-emerald-400/25 flex items-center justify-center gap-2"
                              >
                                <span>GUARDAR SERIE</span>
                                <span className="bg-slate-950/15 px-2 py-0.5 rounded text-[11px] font-mono font-bold">{exInput.peso}kg × {exInput.reps} (RIR{exInput.rir})</span>
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>

          {/* Temporizador Flotante de Descanso */}
          {timer.active && (
            <div className="fixed bottom-3 left-4 right-4 max-w-lg mx-auto bg-slate-900/95 border border-emerald-500/50 rounded-2xl p-3 shadow-[0_10px_25px_rgba(0,0,0,0.8)] backdrop-blur-md flex items-center justify-between gap-3 z-50 animate-bounce-short">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-mono font-black text-sm shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                  ⏱️
                </div>
                <div>
                  <div className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">{timer.exName}</div>
                  <div className="text-lg font-black font-mono text-emerald-400 tracking-tight">
                    {formatTime(timer.secondsLeft)} <span className="text-[10px] text-slate-500 font-sans font-normal">DESCANSO</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: Math.max(0, prev.secondsLeft - 30) }))}
                  className="bg-slate-800 border border-slate-700 text-[11px] font-bold px-2 py-1.5 rounded-lg text-slate-300 active:bg-slate-700"
                >
                  -30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft + 30 }))}
                  className="bg-slate-800 border border-slate-700 text-[11px] font-bold px-2 py-1.5 rounded-lg text-slate-300 active:bg-slate-700"
                >
                  +30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, active: false }))}
                  className="bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs font-extrabold w-8 h-8 rounded-lg flex items-center justify-center ml-1 active:bg-rose-500/40"
                >
                  ✕
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
