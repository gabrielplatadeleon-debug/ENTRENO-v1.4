<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ENTRENO PRO 2026 - Modular Pro</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Estilos modulares CSS -->
  <link rel="stylesheet" href="./css/styles.css">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Drive Client API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body class="bg-black text-slate-100 selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <!-- Scripts Modulares -->
  <script src="./js/routineData.js"></script>
  <script src="./js/storageSync.js"></script>

  <!-- Lógica Principal de la App -->
  <script type="text/babel">
    function App() {
      const [activeTab, setActiveTab] = React.useState("lunes");
      const [profiles, setProfiles] = React.useState(["Perfil Principal"]);
      const [currentProfile, setCurrentProfile] = React.useState("Perfil Principal");
      const [logs, setLogs] = React.useState({});
      const [expandedEx, setExpandedEx] = React.useState({});
      const [inputs, setInputs] = React.useState({});
      const [syncStatus, setSyncStatus] = React.useState("Desconectado de Drive");
      const [accessToken, setAccessToken] = React.useState(null);
      const [flashExId, setFlashExId] = React.useState(null);
      const [timer, setTimer] = React.useState({ active: false, secondsLeft: 0, totalSeconds: 0, exName: "" });

      React.useEffect(() => {
        setLogs(StorageSync.getLogs(currentProfile));
      }, [currentProfile]);

      React.useEffect(() => {
        let interval = null;
        if (timer.active && timer.secondsLeft > 0) {
          interval = setInterval(() => {
            setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft - 1 }));
          }, 1000);
        } else if (timer.secondsLeft === 0 && timer.active) {
          setTimer(prev => ({ ...prev, active: false }));
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
        return () => clearInterval(interval);
      }, [timer.active, timer.secondsLeft]);

      const handleGoogleLogin = () => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              setSyncStatus("Conectado a Drive ☁️");
              alert("¡Conectado correctamente con Google Drive!");
            }
          },
        });
        client.requestAccessToken();
      };

      const handleWeightChange = (exId, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: 6, rir: 2 };
          const newPeso = Math.max(0, +(current.peso + delta).toFixed(2));
          return { ...prev, [exId]: { ...current, peso: newPeso } };
        });
      };

      const handleStepChange = (exId, field, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: 6, rir: 2 };
          let val = current[field] + delta;
          if (field === 'reps') val = Math.max(1, val);
          if (field === 'rir') val = Math.max(0, Math.min(5, val));
          return { ...prev, [exId]: { ...current, [field]: val } };
        });
      };

      const handleSaveSet = (ex) => {
        const exId = ex.id;
        const setInput = inputs[exId] || { peso: 50, reps: 6, rir: 2 };
        const newLogs = { ...logs };
        if (!newLogs[exId]) newLogs[exId] = [];
        const newEntry = {
          fecha: new Date().toISOString().split('T')[0],
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          ...setInput
        };
        newLogs[exId].unshift(newEntry);
        setLogs(newLogs);
        
        StorageSync.saveLogs(currentProfile, newLogs);
        StorageSync.syncToCloud(accessToken, currentProfile, newLogs, setSyncStatus);

        setFlashExId(exId);
        setTimeout(() => setFlashExId(null), 600);

        const restSecs = parseInt(ex.descanso) || 90;
        setTimer({ active: true, secondsLeft: restSecs, totalSeconds: restSecs, exName: ex.nombre });
      };

      const handleAddProfile = () => {
        const name = prompt("Nombre del nuevo perfil:");
        if (name && !profiles.includes(name)) {
          const updated = [...profiles, name];
          setProfiles(updated);
          setCurrentProfile(name);
        }
      };

      const getPlateBreakdown = (totalKg) => {
        const bar = 20;
        if (!totalKg || totalKg <= bar) return "Solo barra (20kg)";
        let rem = (totalKg - bar) / 2;
        if (rem <= 0) return "Solo barra (20kg)";
        const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
        let res = [];
        for (let p of plates) {
          while (rem >= p - 0.001) {
            res.push(p);
            rem = Math.round((rem - p) * 100) / 100;
          }
        }
        const counts = {};
        res.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        const txt = Object.keys(counts).sort((a, b) => b - a).map(k => `${counts[k]}x${k}k`).join(' + ');
        return `${txt} por lado`;
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const routineList = typeof ROUTINE_DATA !== 'undefined' ? ROUTINE_DATA : [];
      const currentDay = routineList.find(d => d.id === activeTab);

      const totalSessionSets = currentDay ? currentDay.ejercicios.reduce((acc, ex) => {
        const exLogs = logs[ex.id] || [];
        return acc + exLogs.filter(e => e.fecha === new Date().toISOString().split('T')[0]).length;
      }, 0) : 0;

      return (
        <div className="min-h-screen bg-black text-slate-100 flex flex-col pb-36 selection:bg-emerald-500 selection:text-black">
          
          {/* Header Superior Comercial */}
          <header className="border-b border-white/5 bg-black/90 backdrop-blur-2xl px-4 py-3 sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xs mono shadow-[0_0_15px_rgba(16,185,129,0.25)]">
                  ⚡
                </div>
                <div>
                  <h1 className="text-emerald-400 font-extrabold text-sm tracking-tight mono leading-none">ENTRENO PRO</h1>
                  <span className="text-[9px] text-neutral-400 font-bold tracking-widest uppercase">MODULAR ARCHITECTURE v3.0</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <select 
                  value={currentProfile}
                  onChange={(e) => setCurrentProfile(e.target.value)}
                  className="bg-neutral-900/90 border border-white/10 text-xs font-bold rounded-xl px-2.5 py-1.5 text-slate-200 outline-none focus:border-emerald-500"
                >
                  {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <button 
                  onClick={handleAddProfile}
                  className="bg-neutral-900/90 border border-white/10 text-xs px-2.5 py-1.5 rounded-xl hover:bg-neutral-800 text-emerald-400 font-black"
                >
                  +
                </button>
              </div>
            </div>
          </header>

          {/* Barra de Progreso de Sesión en Vivo */}
          {activeTab !== "progreso" && currentDay && (
            <div className="max-w-4xl mx-auto w-full px-4 pt-3">
              <div className="glass-card rounded-2xl p-3.5 flex items-center justify-between border border-white/10 shadow-xl">
                <div>
                  <div className="text-[10px] font-black uppercase tracking-widest text-neutral-400">SESIÓN ACTIVA</div>
                  <div className="text-xs font-extrabold text-slate-200 mt-0.5">{currentDay.label} · <span className="text-emerald-400">{currentDay.sub}</span></div>
                </div>
                <div className="text-right">
                  <div className="text-[10px] font-black uppercase tracking-widest text-emerald-400 mono">SERIES COMPLETADAS</div>
                  <div className="text-sm font-black mono text-white">{totalSessionSets} <span className="text-neutral-500 text-xs">ejecutadas</span></div>
                </div>
              </div>
            </div>
          )}

          {/* Contenido Principal */}
          <main className="max-w-4xl mx-auto w-full px-4 py-4 flex-1">
            {activeTab === "progreso" ? (
              <div className="space-y-4">
                <div className="glass-card rounded-3xl p-6 shadow-2xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-emerald-400 mb-2">Sincronización en la Nube</h3>
                  <p className="text-xs text-neutral-400 mb-4">
                    Estado: <strong className="text-slate-200 font-bold">{syncStatus}</strong>
                  </p>
                  {!accessToken ? (
                    <button 
                      onClick={handleGoogleLogin}
                      className="bg-sky-400 text-black font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg shadow-sky-400/20 hover:bg-sky-300 transition"
                    >
                      Conectar Google Drive
                    </button>
                  ) : (
                    <p className="text-xs text-emerald-300 font-bold">¡Conectado! Sincronización modular activa.</p>
                  )}
                </div>

                <div className="glass-card rounded-3xl p-6 shadow-2xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-slate-300 mb-4">Historial Global ({currentProfile})</h3>
                  {Object.keys(logs).length === 0 ? (
                    <p className="text-xs text-neutral-500 italic">No hay series registradas todavía.</p>
                  ) : (
                    <div className="space-y-4">
                      {Object.entries(logs).map(([exId, entries]) => (
                        <div key={exId} className="border-b border-white/5 pb-3 last:border-0">
                          <div className="text-xs font-black text-emerald-400 uppercase tracking-wider">{exId.replace('-', ' ')}</div>
                          <div className="mt-2 space-y-1.5">
                            {entries.map((e, idx) => (
                              <div key={idx} className="text-xs text-slate-300 flex justify-between mono bg-black/60 px-3.5 py-2 rounded-xl border border-white/5">
                                <span className="text-neutral-400">{e.fecha} {e.hora}</span>
                                <span className="font-extrabold text-emerald-400">{e.peso} kg × {e.reps} reps (RIR {e.rir})</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              currentDay && (
                <div className="space-y-3.5">
                  {currentDay.ejercicios.map((ex) => {
                    const isExpanded = expandedEx[ex.id];
                    const exInput = inputs[ex.id] || { peso: 50, reps: 6, rir: 2 };
                    const exLogs = logs[ex.id] || [];
                    const isFlashing = flashExId === ex.id;
                    const completedSetsCount = exLogs.filter(e => e.fecha === new Date().toISOString().split('T')[0]).length;
                    const lastSet = exLogs[0];

                    return (
                      <div key={ex.id} className={`glass-card rounded-3xl overflow-hidden shadow-2xl transition-all ${isFlashing ? 'saved-flash border-emerald-500 bg-emerald-950/20' : ''}`}>
                        
                        <button 
                          onClick={() => setExpandedEx(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                          className="w-full text-left p-4 flex justify-between items-center gap-3 active:bg-white/5 transition"
                        >
                          <div className="flex-1">
                            <div className="flex items-center justify-between gap-2">
                              <h3 className="text-sm font-black tracking-tight text-white uppercase">{ex.nombre}</h3>
                              
                              <div className="flex items-center gap-1.5">
                                {Array.from({ length: ex.series }).map((_, i) => (
                                  <div 
                                    key={i} 
                                    className={`w-2.5 h-2.5 rounded-full transition-all ${i < completedSetsCount ? 'bg-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.9)] scale-110' : 'bg-neutral-800 border border-neutral-700'}`} 
                                  />
                                ))}
                              </div>
                            </div>

                            <div className="mt-2 text-[11px] text-neutral-400 flex items-center justify-between font-medium">
                              <div className="flex items-center gap-2">
                                <span className="text-emerald-400 font-bold">{ex.series} series</span>
                                <span>·</span>
                                <span>{ex.repeticiones} reps</span>
                                <span>·</span>
                                <span>RIR {ex.rir}</span>
                              </div>
                              
                              {!isExpanded && lastSet && (
                                <span className="text-emerald-300 mono text-[10px] font-extrabold bg-emerald-950/60 px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                                  Último: {lastSet.peso}kg × {lastSet.reps}
                                </span>
                              )}
                            </div>
                          </div>
                        </button>

                        {isExpanded && (
                          <div className="px-4 pb-4 pt-1 border-t border-white/5 bg-black/40 space-y-4 text-xs">
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                              <div className="bg-emerald-950/20 border border-emerald-500/20 rounded-2xl p-3.5">
                                <span className="text-[10px] font-black text-emerald-400 tracking-wider uppercase">Técnica Clave</span>
                                <ul className="list-disc list-inside text-slate-300 mt-1 space-y-1 text-[11px]">
                                  {ex.como.map((c, i) => <li key={i}>{c}</li>)}
                                </ul>
                              </div>
                              <div className="bg-rose-950/20 border border-rose-500/20 rounded-2xl p-3.5">
                                <span className="text-[10px] font-black text-rose-400 tracking-wider uppercase">Errores a Evitar</span>
                                <ul className="list-disc list-inside text-neutral-400 mt-1 space-y-1 text-[11px]">
                                  {ex.errores.map((e, i) => <li key={i}>{e}</li>)}
                                </ul>
                              </div>
                            </div>

                            <div className="pt-2 space-y-3.5">
                              <div className="flex items-center justify-between px-0.5">
                                <span className="font-black text-[10px] text-neutral-400 uppercase tracking-widest">REGISTRO DE SERIE ACTIVA</span>
                                {lastSet && (
                                  <span className="text-[10px] text-cyan-300 mono font-bold bg-cyan-950/50 px-2.5 py-1 rounded-xl border border-cyan-500/30">
                                    💡 Anterior: {lastSet.peso}kg × {lastSet.reps} (RIR {lastSet.rir})
                                  </span>
                                )}
                              </div>

                              <div className="space-y-1.5">
                                <div className="flex items-center justify-between gap-1.5">
                                  <button onClick={() => handleWeightChange(ex.id, -2.5)} className="h-12 flex-1 bg-neutral-900 active:bg-neutral-800 rounded-2xl border border-white/10 text-xs font-black mono text-slate-200 shadow-sm">-2.5</button>
                                  <button onClick={() => handleWeightChange(ex.id, -1.25)} className="h-12 flex-1 bg-neutral-900 active:bg-neutral-800 rounded-2xl border border-white/10 text-xs font-black mono text-slate-200 shadow-sm">-1.25</button>
                                  <div className="h-13 px-4 bg-black border border-emerald-500/80 rounded-2xl flex items-center justify-center font-black text-emerald-400 text-lg tracking-tight shadow-[0_0_20px_rgba(16,185,129,0.25)] min-w-[110px] mono">
                                    {exInput.peso} kg
                                  </div>
                                  <button onClick={() => handleWeightChange(ex.id, 1.25)} className="h-12 flex-1 bg-neutral-900 active:bg-neutral-800 rounded-2xl border border-white/10 text-xs font-black mono text-slate-200 shadow-sm">+1.25</button>
                                  <button onClick={() => handleWeightChange(ex.id, 2.5)} className="h-12 flex-1 bg-neutral-900 active:bg-neutral-800 rounded-2xl border border-white/10 text-xs font-black mono text-slate-200 shadow-sm">+2.5</button>
                                </div>
                                <div className="text-[10px] mono text-cyan-400 text-right px-1 font-semibold">
                                  ⚖️ {getPlateBreakdown(exInput.peso)}
                                </div>
                              </div>

                              <div className="grid grid-cols-2 gap-3">
                                <div className="bg-neutral-900/90 border border-white/10 rounded-2xl p-3 flex items-center justify-between">
                                  <span className="text-[10px] font-black text-neutral-400 tracking-wider">REPS</span>
                                  <div className="flex items-center gap-2.5">
                                    <button onClick={() => handleStepChange(ex.id, 'reps', -1)} className="w-9 h-9 bg-neutral-800 active:bg-emerald-400 active:text-black rounded-xl border border-white/10 font-black text-base flex items-center justify-center transition">-</button>
                                    <span className="font-black text-lg w-6 text-center mono text-white">{exInput.reps}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'reps', 1)} className="w-9 h-9 bg-neutral-800 active:bg-emerald-400 active:text-black rounded-xl border border-white/10 font-black text-base flex items-center justify-center transition">+</button>
                                  </div>
                                </div>
                                <div className="bg-neutral-900/90 border border-white/10 rounded-2xl p-3 flex items-center justify-between">
                                  <span className="text-[10px] font-black text-neutral-400 tracking-wider">RIR</span>
                                  <div className="flex items-center gap-2.5">
                                    <button onClick={() => handleStepChange(ex.id, 'rir', -1)} className="w-9 h-9 bg-neutral-800 active:bg-emerald-400 active:text-black rounded-xl border border-white/10 font-black text-base flex items-center justify-center transition">-</button>
                                    <span className="font-black text-lg w-6 text-center mono text-white">{exInput.rir}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'rir', 1)} className="w-9 h-9 bg-neutral-800 active:bg-emerald-400 active:text-black rounded-xl border border-white/10 font-black text-base flex items-center justify-center transition">+</button>
                                  </div>
                                </div>
                              </div>

                              <button 
                                onClick={() => handleSaveSet(ex)}
                                className="w-full bg-emerald-400 hover:bg-emerald-300 active:scale-[0.98] text-black font-black py-4 rounded-2xl text-xs tracking-wider uppercase transition shadow-xl shadow-emerald-400/30 flex items-center justify-center gap-2"
                              >
                                <span>GUARDAR SERIE</span>
                                <span className="bg-black/15 px-2.5 py-1 rounded-xl text-[11px] mono font-extrabold">{exInput.peso}kg × {exInput.reps} (RIR{exInput.rir})</span>
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>

          {/* Barra de Navegación Inferior */}
          <nav className="glass-nav fixed bottom-0 left-0 right-0 z-40 px-3 py-2.5">
            <div className="max-w-md mx-auto flex items-center justify-around gap-1">
              {routineList.map(day => (
                <button
                  key={day.id}
                  onClick={() => setActiveTab(day.id)}
                  className={`flex-1 py-2 px-1 rounded-2xl text-[11px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === day.id ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
                >
                  <span className="tracking-tighter">{day.label}</span>
                  <span className="text-[9px] opacity-70 font-medium">{day.sub.split(' ')[1]}</span>
                </button>
              ))}
              <button
                onClick={() => setActiveTab("progreso")}
                className={`flex-1 py-2 px-1 rounded-2xl text-[11px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === "progreso" ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
              >
                <span className="tracking-tighter">CLOUD</span>
                <span className="text-[9px] opacity-70 font-medium">DRIVE</span>
              </button>
            </div>
          </nav>

          {/* Temporizador Flotante */}
          {timer.active && (
            <div className="fixed bottom-20 left-4 right-4 max-w-lg mx-auto glass-card border border-emerald-500/60 rounded-3xl p-4 shadow-[0_15px_35px_rgba(0,0,0,0.9)] flex items-center justify-between gap-3 z-50">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 mono font-black text-base shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                  ⏱️
                </div>
                <div>
                  <div className="text-[10px] font-extrabold text-neutral-400 uppercase tracking-wider">{timer.exName}</div>
                  <div className="text-xl font-black mono text-emerald-400 tracking-tight">
                    {formatTime(timer.secondsLeft)} <span className="text-[10px] text-neutral-500 font-sans font-medium">DESCANSO</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: Math.max(0, prev.secondsLeft - 30) }))}
                  className="bg-neutral-900 border border-white/10 text-xs font-bold px-3 py-2 rounded-xl text-slate-300 active:bg-neutral-800"
                >
                  -30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft + 30 }))}
                  className="bg-neutral-900 border border-white/10 text-xs font-bold px-3 py-2 rounded-xl text-slate-300 active:bg-neutral-800"
                >
                  +30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, active: false }))}
                  className="bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs font-extrabold w-9 h-9 rounded-xl flex items-center justify-center ml-1 active:bg-rose-500/40"
                >
                  ✕
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
