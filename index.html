  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ENTRENO PRO 2026 - Bulletproof v3.8</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    body { background-color: #000000; color: #f8fafc; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    
    .glass-card {
      background: linear-gradient(135deg, rgba(18, 18, 22, 0.7) 0%, rgba(10, 10, 14, 0.8) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-nav {
      background: rgba(5, 5, 8, 0.85);
      backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    @keyframes neonPulse {
      0% { box-shadow: 0 0 25px rgba(16,185,129,0.5); border-color: rgba(16,185,129,0.9); }
      100% { box-shadow: 0 0 10px rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.4); }
    }
    .saved-flash { animation: neonPulse 0.5s ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body class="bg-black text-slate-100 selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const ROUTINE_DATA = [

          {

          },
          {
            id: "press-inclinado-manc",

            series: 3,
            como: ["Banco 30°, muñecas neutras arriba", "Baja hasta estiramiento pecho sin chocar", "Sube sin juntar mancuernas bruscamente"],

          },
          {
            id: "jalon-neutro",
            nombre: "JALÓN NEUTRO",
            series: 3,
            como: ["Agarre neutro cerrado, pecho alto", "Tira codos hacia costillas, no hacia atrás", "Estira completo sin perder tensión"],

          },
          {
            id: "elevacion-lateral",

            series: 2,
            como: ["Mancuernas a lados, codo semi flexionado", "Eleva hasta altura hombro liderando codo", "Baja 2s sin balanceo"],

          }
        ]
      },
      {
        id: "martes",
        label: "MARTES",
        sub: "LOWER",
        ejercicios: [
          {
            id: "sentadilla",
            nombre: "SENTADILLA",
            series: 4,
            como: ["Barra media-trapecio, pies ancho hombros", "Rodillas hacia afuera, rompe paralelo", "Sube empujando suelo, cadera y hombros a la vez"],
            errores: ["Talones se levantan o rodillas colapsan dentro", "Perder tensión lumbar abajo"]
          },
          {
            id: "rdl",
            nombre: "RDL",
            series: 3,
            como: ["Barra pegada a piernas, bisagra profunda", "Espalda neutra, glúteos atrás hasta estiramiento", "Sube empujando cadera adelante"],
            errores: ["Flexionar rodillas como sentadilla", "Redondear espalda baja"]
          },
          {
            id: "prensa-45",
            nombre: "PRENSA 45°",
            series: 2,
            como: ["Pies medios plataforma, lumbar apoyada", "Baja controlado hasta 90° rodilla", "Empuja sin bloquear rodillas violento"],
            errores: ["Glúteo se despega abajo", "Bajar muy corto por ego"]
          },
          {
            id: "curl-femoral-tumbado",
            nombre: "CURL FEMORAL TUMBADO",
            series: 3,
            como: ["Cadera pegada al banco, agarre firme", "Flexiona hasta tope sin levantar cadera", "Baja lento 2s"],
            errores: ["Elevar cadera para trampear", "Rango parcial constante"]
          },
          {
            id: "gemelo-pie",
            nombre: "GEMELO DE PIE",
            series: 4,
            como: ["Apoyo antepié, estira abajo completo", "Pausa 1s arriba contrayendo fuerte", "Rodilla extendida sin bloqueo"],
            errores: ["Rebotar sin control", "No estirar abajo"]
          }
        ]
      },
      {
        id: "jueves",
        label: "JUEVES",
        sub: "UPPER",
        ejercicios: [
          {
            id: "press-militar",
            nombre: "PRESS MILITAR",
            series: 3,
            como: ["Glúteo apretado, costillas abajo", "Barra de clavícula a sobre cabeza recto", "Cabeza pasa al frente al final"],
            errores: ["Arquear lumbar excesivo", "Barra se va muy al frente"]
          },
          {
            id: "remo-polea",
            nombre: "REMO POLEA",
            series: 3,
            como: ["Torso vertical, agarre medio", "Codos atrás, pausa 1s contra abdomen", "Estira dorsal sin encorvar"],
            errores: ["Jalar con impulso de tronco", "No retraer escápula"]
          },
          {
            id: "fondos",
            nombre: "FONDOS",
            series: 3,
            como: ["Hombros deprimidos, leve inclinación", "Baja hasta 90° codo, pecho estirado", "Sube bloqueando sin encoger"],
            errores: ["Hombros hacia orejas", "Rango muy corto"]
          },
          {
            id: "curl-inclinado",
            nombre: "CURL INCLINADO",
            series: 3,
            como: ["Banco 60°, hombros atrás", "Curl sin mover hombro, supina completo", "Baja lento estirando bíceps"],
            errores: ["Balancear mancuerna con hombro", "No extender abajo"]
          },
          {
            id: "pajaros-maquina",
            nombre: "PÁJAROS MÁQUINA",
            series: 3,
            como: ["Pecho apoyado, agarre neutro", "Abre codos atrás hasta línea hombro", "Aprieta deltoide posterior arriba"],
            errores: ["Usar trapecio superior", "Rango excesivo hiperextendiendo"]
          }
        ]
      },
      {
        id: "viernes",
        label: "VIERNES",
        sub: "LOWER",
        ejercicios: [
          {
            id: "hack-squat",
            nombre: "HACK SQUAT",
            series: 3,
            como: ["Espalda pegada, pies medio-altos", "Baja profundo controlado", "Empuja con talón sin despegar lumbar"],
            errores: ["Rodillas dentro o talones arriba", "Descenso a medias"]
          },
          {
            id: "hip-thrust",
            nombre: "HIP THRUST",
            series: 3,
            como: ["Escápulas en banco, barbilla neutra", "Sube cadera hasta línea rodilla-hombro", "Aprieta glúteo 1s arriba"],
            errores: ["Hiperextender lumbar arriba", "Pies muy lejos/cerca"]
          },
          {
            id: "bulgara",
            nombre: "ZANCADA BÚLGARA",
            series: 2,
            como: ["Pie trasero en banco, tronco recto", "Baja rodilla trasera casi al suelo", "Sube con pierna delantera sin impulso"],
            errores: ["Tronco se inclina excesivo", "Rodilla delantera colapsa dentro"]
          },
          {
            id: "ext-cuadriceps",
            nombre: "EXTENSIÓN CUÁDRICEPS",
            series: 2,
            como: ["Respaldo firme, punta pie neutra", "Extiende hasta casi bloqueo controlado", "Baja 2s sin dejar caer"],
            errores: ["Arrancar con tirón de cadera", "Dejar caer el peso en la bajada"]
          }
        ]
      }
    ];

    const MODE_CONFIGS = {
      fuerza: {
        label: "FUERZA",
        repsDefault: 4,
        repsRange: "3-5",
        rirDefault: 2,
        restDefault: 180,
        desc: "Alta Carga · Descanso Largo"
      },
      hipertrofia: {
        label: "HIPERTROFIA",
        repsDefault: 8,
        repsRange: "6-12",
        rirDefault: 1,
        restDefault: 90,
        desc: "Volumen Óptimo · Tensión Estructurada"
      },
      resistencia: {
        label: "RESISTENCIA",
        repsDefault: 15,
        repsRange: "12-20",
        rirDefault: 0,
        restDefault: 60,
        desc: "Densidad Metabólica · Fallo Controlado"
      }
    };

    function App() {
      const [activeTab, setActiveTab] = React.useState("lunes");
      const [trainingMode, setTrainingMode] = React.useState("hipertrofia");
      const [profiles, setProfiles] = React.useState(["Perfil Principal"]);
      const [currentProfile, setCurrentProfile] = React.useState("Perfil Principal");
      const [logs, setLogs] = React.useState({});
      const [expandedEx, setExpandedEx] = React.useState({});
      const [showHelp, setShowHelp] = React.useState({});
      const [showGlossary, setShowGlossary] = React.useState(false);
      const [inputs, setInputs] = React.useState({});
      const [syncStatus, setSyncStatus] = React.useState("Desconectado de Drive");
      const [accessToken, setAccessToken] = React.useState(null);
      const [flashExId, setFlashExId] = React.useState(null);
      const [timer, setTimer] = React.useState({ active: false, secondsLeft: 0, totalSeconds: 0, exName: "" });

      const currentMode = MODE_CONFIGS[trainingMode];

      React.useEffect(() => {
        const saved = localStorage.getItem(`entreno_logs_${currentProfile}`);
        if (saved) {
          try { setLogs(JSON.parse(saved)); } catch(e){}
        } else {
          setLogs({});
        }
      }, [currentProfile]);

      React.useEffect(() => {
        let interval = null;
        if (timer.active && timer.secondsLeft > 0) {
          interval = setInterval(() => {
            setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft - 1 }));
          }, 1000);
        } else if (timer.secondsLeft === 0 && timer.active) {
          setTimer(prev => ({ ...prev, active: false }));
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
        return () => clearInterval(interval);
      }, [timer.active, timer.secondsLeft]);

      const handleGoogleLogin = () => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if (response.access_token) {
              setAccessToken(response.access_token);
              setSyncStatus("Conectado a Drive ☁️");
              alert("¡Conectado correctamente con Google Drive!");
            }
          },
        });
        client.requestAccessToken();
      };

      const syncToDriveCloud = async (updatedLogs) => {
        if (!accessToken) return;
        setSyncStatus("Sincronizando...");
        try {
          const fileContent = JSON.stringify({ profile: currentProfile, logs: updatedLogs, updatedAt: new Date().toISOString() }, null, 2);
          const fileName = `entreno_backup_${currentProfile}.json`;

          const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and mimeType='application/json'`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            const fileId = searchData.files[0].id;
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
              body: fileContent
            });
          } else {
            const metadata = { name: fileName, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}` },
              body: form
            });
          }
          setSyncStatus("Sincronizado ✔️");
        } catch (err) {
          setSyncStatus("Error Drive ⚠️");
        }
      };

      const handleWeightChange = (exId, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: currentMode.repsDefault, rir: currentMode.rirDefault };
          const newPeso = Math.max(0, +(current.peso + delta).toFixed(2));
          return { ...prev, [exId]: { ...current, peso: newPeso } };
        });
      };

      const handleStepChange = (exId, field, delta) => {
        setInputs(prev => {
          const current = prev[exId] || { peso: 50, reps: currentMode.repsDefault, rir: currentMode.rirDefault };
          let val = current[field] + delta;
          if (field === 'reps') val = Math.max(1, val);
          if (field === 'rir') val = Math.max(0, Math.min(5, val));
          return { ...prev, [exId]: { ...current, [field]: val } };
        });
      };

      const handleSaveSet = (ex) => {
        const exId = ex.id;
        const setInput = inputs[exId] || { peso: 50, reps: currentMode.repsDefault, rir: currentMode.rirDefault };
        const newLogs = { ...logs };
        if (!newLogs[exId]) newLogs[exId] = [];
        const newEntry = {
          fecha: new Date().toISOString().split('T')[0],
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          modo: trainingMode,
          ...setInput
        };
        newLogs[exId].unshift(newEntry);
        setLogs(newLogs);
        
        localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs));
        syncToDriveCloud(newLogs);

        setFlashExId(exId);
        setTimeout(() => setFlashExId(null), 600);

        const restSecs = currentMode.restDefault;
        setTimer({ active: true, secondsLeft: restSecs, totalSeconds: restSecs, exName: ex.nombre });
      };

      const handleDeleteSet = (exId, index) => {
        const newLogs = { ...logs };
        if (newLogs[exId]) {
          newLogs[exId].splice(index, 1);
          if (newLogs[exId].length === 0) delete newLogs[exId];
          setLogs(newLogs);
          localStorage.setItem(`entreno_logs_${currentProfile}`, JSON.stringify(newLogs));
          syncToDriveCloud(newLogs);
        }
      };

      const handleAddProfile = () => {
        const name = prompt("Nombre del nuevo perfil:");
        if (name && !profiles.includes(name)) {
          const updated = [...profiles, name];
          setProfiles(updated);
          setCurrentProfile(name);
        }
      };

      const getPlateBreakdown = (totalKg) => {
        const bar = 20;
        if (!totalKg || totalKg <= bar) return "Barra (20kg)";
        let rem = (totalKg - bar) / 2;
        if (rem <= 0) return "Barra (20kg)";
        const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
        let res = [];
        for (let p of plates) {
          while (rem >= p - 0.001) {
            res.push(p);
            rem = Math.round((rem - p) * 100) / 100;
          }
        }
        const counts = {};
        res.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        const txt = Object.keys(counts).sort((a, b) => b - a).map(k => `${counts[k]}x${k}k`).join('+');
        return `${txt} / lado`;
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const currentDay = ROUTINE_DATA.find(d => d.id === activeTab);

      const todayDate = new Date().toISOString().split('T')[0];
      let totalSessionSets = 0;
      let totalSessionVolume = 0;

      if (currentDay) {
        currentDay.ejercicios.forEach(ex => {
          const exLogs = logs[ex.id] || [];
          const todayLogs = exLogs.filter(e => e.fecha === todayDate);
          totalSessionSets += todayLogs.length;
          todayLogs.forEach(entry => {
            totalSessionVolume += (entry.peso || 0) * (entry.reps || 0);
          });
        });
      }

      return (
        <div className="min-h-screen bg-black text-slate-100 flex flex-col pb-36 selection:bg-emerald-500 selection:text-black">
          
          <header className="border-b border-white/5 bg-black/90 backdrop-blur-2xl px-4 py-3 sticky top-0 z-30">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xs mono shadow-[0_0_15px_rgba(16,185,129,0.25)]">
                  ⚡
                </div>
                <div>
                  <h1 className="text-emerald-400 font-extrabold text-sm tracking-tight mono leading-none">ENTRENO PRO</h1>
                  <span className="text-[9px] text-neutral-400 font-bold tracking-widest uppercase">MODE ENGINE v3.8</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowGlossary(true)}
                  className="bg-neutral-900/90 border border-emerald-500/40 text-xs px-2.5 py-1.5 rounded-xl text-emerald-400 font-black flex items-center gap-1 shadow-[0_0_10px_rgba(16,185,129,0.15)]"
                >
                  <span>❓</span> Glosario
                </button>
                <select 
                  value={currentProfile}
                  onChange={(e) => setCurrentProfile(e.target.value)}
                  className="bg-neutral-900/90 border border-white/10 text-xs font-bold rounded-xl px-2.5 py-1.5 text-slate-200 outline-none focus:border-emerald-500"
                >
                  {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                <button 
                  onClick={handleAddProfile}
                  className="bg-neutral-900/90 border border-white/10 text-xs px-2.5 py-1.5 rounded-xl hover:bg-neutral-800 text-emerald-400 font-black"
                >
                  +
                </button>
              </div>
            </div>
          </header>

          {/* MODAL DE GLOSARIO */}
          {showGlossary && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card border border-emerald-500/40 rounded-3xl p-5 max-w-md w-full space-y-4 shadow-2xl animate-fadeIn">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-emerald-400 font-black text-sm uppercase tracking-wider flex items-center gap-2">
                    <span>📖</span> Glosario Técnico de Entrenamiento
                  </h3>
                  <button 
                    onClick={() => setShowGlossary(false)}
                    className="w-8 h-8 rounded-xl bg-neutral-900 text-neutral-400 hover:text-white flex items-center justify-center font-black"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 max-h-[60vh] overflow-y-auto pr-1">
                  <div className="bg-neutral-900/90 p-3 rounded-2xl border border-white/5 space-y-1">
                    <strong className="text-emerald-400 font-extrabold">RIR (Reps in Reserve):</strong>
                    <p className="text-neutral-400 text-[11px]">Repeticiones que te quedan en recámara antes del fallo técnico absoluto.</p>
                  </div>
                  <div className="bg-neutral-900/90 p-3 rounded-2xl border border-white/5 space-y-1">
                    <strong className="text-cyan-400 font-extrabold">Tonelaje / Volumen:</strong>
                    <p className="text-neutral-400 text-[11px]">Suma total de Peso × Repeticiones completadas en la sesión.</p>
                  </div>
                </div>

                <button 
                  onClick={() => setShowGlossary(false)}
                  className="w-full bg-emerald-400 text-black font-black py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-400/20"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

          {activeTab !== "progreso" && currentDay && (
            <div className="max-w-4xl mx-auto w-full px-4 pt-3 space-y-2">
              
              {/* SELECTOR DE MODO DE ENTRENAMIENTO */}
              <div className="glass-card rounded-2xl p-2.5 border border-white/10 shadow-xl flex items-center justify-between gap-2">
                <span className="text-[9px] font-black uppercase tracking-widest text-neutral-400 pl-1">ENFOQUE</span>
                <div className="flex items-center gap-1.5 flex-1 max-w-xs">
                  {Object.keys(MODE_CONFIGS).map(modeKey => {
                    const cfg = MODE_CONFIGS[modeKey];
                    const isActive = trainingMode === modeKey;
                    return (
                      <button
                        key={modeKey}
                        onClick={() => setTrainingMode(modeKey)}
                        className={`flex-1 py-1.5 px-2 rounded-xl text-[10px] font-black uppercase transition-all ${isActive ? 'bg-emerald-400 text-black shadow-[0_0_12px_rgba(16,185,129,0.4)] scale-105' : 'bg-neutral-900 text-neutral-400 hover:text-white border border-white/5'}`}
                      >
                        {cfg.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* MÉTROLOGÍA DE SESIÓN */}
              <div className="glass-card rounded-2xl p-3 flex items-center justify-between border border-white/10 shadow-xl">
                <div>
                  <div className="text-[9px] font-black uppercase tracking-widest text-neutral-400">SESIÓN ACTIVA</div>
                  <div className="text-xs font-extrabold text-slate-200 mt-0.5">{currentDay.label} · <span className="text-emerald-400">{currentMode.label}</span></div>
                  <div className="text-[9px] text-cyan-400 font-semibold mt-0.5">{currentMode.desc}</div>
                </div>
                <div className="flex items-center gap-4 text-right">
                  <div>
                    <div className="text-[9px] font-black uppercase tracking-widest text-cyan-400 mono">VOLUMEN</div>
                    <div className="text-xs font-black mono text-white">{totalSessionVolume.toLocaleString()} <span className="text-neutral-500 text-[9px]">kg</span></div>
                  </div>
                  <div>
                    <div className="text-[9px] font-black uppercase tracking-widest text-emerald-400 mono">SERIES</div>
                    <div className="text-xs font-black mono text-white">{totalSessionSets} <span className="text-neutral-500 text-[9px]">hechas</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          <main className="max-w-4xl mx-auto w-full px-4 py-3 flex-1">
            {activeTab === "progreso" ? (
              <div className="space-y-4">
                <div className="glass-card rounded-3xl p-6 shadow-2xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-emerald-400 mb-2">Sincronización en la Nube</h3>
                  <p className="text-xs text-neutral-400 mb-4">
                    Estado: <strong className="text-slate-200 font-bold">{syncStatus}</strong>
                  </p>
                  {!accessToken ? (
                    <button 
                      onClick={handleGoogleLogin}
                      className="bg-sky-400 text-black font-extrabold text-xs px-5 py-3 rounded-2xl shadow-lg shadow-sky-400/20 hover:bg-sky-300 transition"
                    >
                      Conectar Google Drive
                    </button>
                  ) : (
                    <p className="text-xs text-emerald-300 font-bold">¡Conectado! Sincronización activa en tiempo real.</p>
                  )}
                </div>

                <div className="glass-card rounded-3xl p-6 shadow-2xl">
                  <h3 className="text-xs font-black uppercase tracking-widest text-slate-300 mb-4">Historial Global ({currentProfile})</h3>
                  {Object.keys(logs).length === 0 ? (
                    <p className="text-xs text-neutral-500 italic">No hay series registradas todavía.</p>
                  ) : (
                    <div className="space-y-4">
                      {Object.entries(logs).map(([exId, entries]) => (
                        <div key={exId} className="border-b border-white/5 pb-3 last:border-0">
                          <div className="text-xs font-black text-emerald-400 uppercase tracking-wider">{exId.replace('-', ' ')}</div>
                          <div className="mt-2 space-y-1.5">
                            {entries.map((e, idx) => (
                              <div key={idx} className="text-xs text-slate-300 flex justify-between mono bg-black/60 px-3.5 py-2 rounded-xl border border-white/5">
                                <span className="text-neutral-400">{e.fecha} {e.hora} <strong className="text-cyan-400 uppercase text-[9px]">[{e.modo || 'hip'}]</strong></span>
                                <span className="font-extrabold text-emerald-400">{e.peso} kg × {e.reps} reps (RIR {e.rir})</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              currentDay && (
                <div className="space-y-3">
                  {currentDay.ejercicios.map((ex) => {
                    const isExpanded = expandedEx[ex.id];
                    const isHelpOpen = showHelp[ex.id];
                    const exInput = inputs[ex.id] || { peso: 50, reps: currentMode.repsDefault, rir: currentMode.rirDefault };
                    const exLogs = logs[ex.id] || [];
                    const isFlashing = flashExId === ex.id;
                    const todayLogs = exLogs.filter(e => e.fecha === todayDate);
                    const completedSetsCount = todayLogs.length;
                    const lastSet = exLogs[0];

                    return (
                      <div key={ex.id} className={`glass-card rounded-2xl overflow-hidden shadow-2xl transition-all ${isFlashing ? 'saved-flash border-emerald-500 bg-emerald-950/20' : ''}`}>
                        
                        <button 
                          onClick={() => setExpandedEx(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                          className="w-full text-left p-3 flex justify-between items-center gap-3 active:bg-white/5 transition"
                        >
                          <div className="flex-1">
                            <div className="flex items-center justify-between gap-2">
                              <h3 className="text-xs font-black tracking-tight text-emerald-400 uppercase">{ex.nombre}</h3>
                              
                              <div className="flex items-center gap-1">
                                {Array.from({ length: ex.series }).map((_, i) => (
                                  <div 
                                    key={i} 
                                    className={`w-2 h-2 rounded-full transition-all ${i < completedSetsCount ? 'bg-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.9)] scale-110' : 'bg-neutral-800 border border-neutral-700'}`} 
                                  />
                                ))}
                              </div>
                            </div>

                            <div className="mt-1 text-[10px] text-neutral-400 flex items-center justify-between font-medium">
                              <div className="flex items-center gap-1.5">
                                <span className="text-slate-200 font-bold">{ex.series} series</span>
                                <span>·</span>
                                <span>{currentMode.repsRange} reps</span>
                                <span>·</span>
                                <span>RIR {currentMode.rirDefault}</span>
                              </div>
                              
                              {!isExpanded && lastSet && (
                                <span className="text-emerald-300 mono text-[9px] font-extrabold bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-500/30">
                                  Último: {lastSet.peso}kg × {lastSet.reps}
                                </span>
                              )}
                            </div>
                          </div>
                        </button>

                        {isExpanded && (
                          <div className="px-3 pb-3 pt-1 border-t border-white/5 bg-black/40 space-y-2.5 text-xs">
                            
                            <div>
                              <button
                                onClick={() => setShowHelp(prev => ({ ...prev, [ex.id]: !prev[ex.id] }))}
                                className="w-full bg-neutral-900/80 border border-white/10 hover:border-emerald-500/40 text-neutral-400 font-bold py-1 px-2.5 rounded-xl flex items-center justify-between text-[10px] transition"
                              >
                                <span className="flex items-center gap-1.5 text-emerald-400">
                                  <span>💡</span> Guía Técnica
                                </span>
                                <span className="text-neutral-500">{isHelpOpen ? '▲ Ocultar' : '▼ Ver'}</span>
                              </button>

                              {isHelpOpen && (
                                <div className="grid grid-cols-1 gap-2 mt-2">
                                  <div className="bg-emerald-950/20 border border-emerald-500/20 rounded-xl p-2.5">
                                    <span className="text-[9px] font-black text-emerald-400 uppercase">Técnica Clave</span>
                                    <ul className="list-disc list-inside text-slate-300 mt-0.5 space-y-0.5 text-[10px]">
                                      {ex.como.map((c, i) => <li key={i}>{c}</li>)}
                                    </ul>
                                  </div>
                                  <div className="bg-rose-950/20 border border-rose-500/20 rounded-xl p-2.5">
                                    <span className="text-[9px] font-black text-rose-400 uppercase">Errores a Evitar</span>
                                    <ul className="list-disc list-inside text-neutral-400 mt-0.5 space-y-0.5 text-[10px]">
                                      {ex.errores.map((e, i) => <li key={i}>{e}</li>)}
                                    </ul>
                                  </div>
                                </div>
                              )}
                            </div>

                            {todayLogs.length > 0 && (
                              <div className="space-y-1">
                                <span className="font-black text-[9px] text-emerald-400 uppercase tracking-widest">SERIES COMPLETADAS</span>
                                <div className="space-y-1">
                                  {todayLogs.map((set, sIndex) => {
                                    const originalIndex = exLogs.findIndex(item => item === set);
                                    return (
                                      <div key={sIndex} className="flex items-center justify-between bg-neutral-900/90 border border-white/10 rounded-xl px-3 py-1.5 mono text-xs">
                                        <div className="flex items-center gap-2.5">
                                          <span className="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 font-black flex items-center justify-center text-[9px]">
                                            #{todayLogs.length - sIndex}
                                          </span>
                                          <span className="font-extrabold text-white">{set.peso} kg</span>
                                          <span className="text-neutral-500">×</span>
                                          <span className="font-extrabold text-slate-200">{set.reps} reps</span>
                                          <span className="text-neutral-500 text-[9px]">(RIR {set.rir})</span>
                                        </div>
                                        <button 
                                          onClick={() => handleDeleteSet(ex.id, originalIndex)}
                                          className="text-neutral-500 hover:text-rose-400 font-black px-1"
                                        >
                                          ✕
                                        </button>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            )}

                            <div className="bg-neutral-950/90 border border-emerald-500/30 rounded-2xl p-2.5 space-y-2">
                              <div className="flex items-center justify-between">
                                <span className="font-black text-[9px] text-emerald-400 uppercase tracking-widest">NUEVA SERIE [{currentMode.label}]</span>
                                {lastSet && (
                                  <span className="text-[9px] text-cyan-300 mono font-bold bg-cyan-950/50 px-2 py-0.5 rounded-lg border border-cyan-500/30">
                                    Ant: {lastSet.peso}kg × {lastSet.reps}
                                  </span>
                                )}
                              </div>

                              <div className="flex items-center gap-2">
                                
                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">PESO (KG)</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleWeightChange(ex.id, -2.5)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-emerald-400 mono">{exInput.peso}</span>
                                    <button onClick={() => handleWeightChange(ex.id, 2.5)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">REPS</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleStepChange(ex.id, 'reps', -1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-white mono">{exInput.reps}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'reps', 1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <div className="flex-1 bg-neutral-900 rounded-xl p-1.5 border border-white/5 flex flex-col items-center">
                                  <span className="text-[8px] font-black text-neutral-400 uppercase">RIR</span>
                                  <div className="flex items-center justify-between w-full mt-0.5">
                                    <button onClick={() => handleStepChange(ex.id, 'rir', -1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">-</button>
                                    <span className="font-black text-xs text-white mono">{exInput.rir}</span>
                                    <button onClick={() => handleStepChange(ex.id, 'rir', 1)} className="w-5 h-5 bg-neutral-800 text-slate-300 rounded text-xs font-black">+</button>
                                  </div>
                                </div>

                                <button 
                                  onClick={() => handleSaveSet(ex)}
                                  className="h-11 w-12 bg-emerald-400 hover:bg-emerald-300 active:scale-95 text-black font-black rounded-xl text-lg flex items-center justify-center shadow-lg shadow-emerald-400/30 transition"
                                  title="Guardar Serie"
                                >
                                  ✓
                                </button>

                              </div>

                              <div className="text-[9px] mono text-cyan-400 text-right px-0.5 font-semibold">
                                ⚖️ {getPlateBreakdown(exInput.peso)}
                              </div>
                            </div>

                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            )}
          </main>

          <nav className="glass-nav fixed bottom-0 left-0 right-0 z-40 px-3 py-2">
            <div className="max-w-md mx-auto flex items-center justify-around gap-1">
              {ROUTINE_DATA.map(day => (
                <button
                  key={day.id}
                  onClick={() => setActiveTab(day.id)}
                  className={`flex-1 py-1.5 px-1 rounded-xl text-[10px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === day.id ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
                >
                  <span className="tracking-tighter">{day.label}</span>
                  <span className="text-[8px] opacity-70 font-medium">{day.sub}</span>
                </button>
              ))}
              <button
                onClick={() => setActiveTab("progreso")}
                className={`flex-1 py-1.5 px-1 rounded-xl text-[10px] font-extrabold flex flex-col items-center gap-0.5 transition ${activeTab === "progreso" ? 'bg-emerald-400 text-black shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-neutral-400 hover:text-white'}`}
              >
                <span className="tracking-tighter">CLOUD</span>
                <span className="text-[8px] opacity-70 font-medium">DRIVE</span>
              </button>
            </div>
          </nav>

          {timer.active && (
            <div className="fixed bottom-16 left-3 right-3 max-w-lg mx-auto glass-card border border-emerald-500/60 rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-2 z-50">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 mono font-black text-sm">
                  ⏱️
                </div>
                <div>
                  <div className="text-[9px] font-extrabold text-neutral-400 uppercase">{timer.exName}</div>
                  <div className="text-lg font-black mono text-emerald-400 leading-none mt-0.5">
                    {formatTime(timer.secondsLeft)}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: Math.max(0, prev.secondsLeft - 30) }))}
                  className="bg-neutral-900 border border-white/10 text-[10px] font-bold px-2.5 py-1.5 rounded-lg text-slate-300"
                >
                  -30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, secondsLeft: prev.secondsLeft + 30 }))}
                  className="bg-neutral-900 border border-white/10 text-[10px] font-bold px-2.5 py-1.5 rounded-lg text-slate-300"
                >
                  +30s
                </button>
                <button 
                  onClick={() => setTimer(prev => ({ ...prev, active: false }))}
                  className="bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs font-black w-8 h-8 rounded-lg flex items-center justify-center ml-0.5"
                >
                  ✕
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
